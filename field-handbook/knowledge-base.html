джетных видеокартах обычно 2 выхода, на средних 3-4. Нужна модель с нужным числом выходов</li>\n<li><strong>Кабели</strong> — DisplayPort лучше HDMI (выше частота обновления, меньше задержка). VGA забыть — устарел</li>\n<li><strong>Настройка</strong> — Win+P → выбрать «расширить экран». Правой кнопкой на рабочем столе → «Параметры экрана» → расположить мониторы по физическому расположению на столе</li>\n<li><strong>Разные разрешения</strong> — Windows сам подстроит масштабирование. Но текст может выглядеть размыто на старом мониторе — лучше одинаковое разрешение</li>\n</ul>\n<p><strong>Калибровка цвета (для фотографов/дизайнеров):</strong></p>\n<ul>\n<li><strong>Базовая калибровка глазом</strong> — встроенная утилита <code>dccw.exe</code> (Win+R → dccw). Бесплатно, занимает 5 минут. Достаточно для офиса</li>\n<li><strong>Профессиональная калибровка колориметром</strong> — нужен прибор (X-Rite i1 Display Pro, Datacolor SpyderX). Цена 15-25 тыс. Услуга мастера с прибором — 2000-3000₽ за один монитор + создание профиля ICC</li>\n</ul>\n<p><strong>Что НЕ браться без оборудования:</strong></p>\n<ul>\n<li>Печать-калибровка (синхронизация экрана с принтером — нужны спектрофотометр + опыт)</li>\n<li>Калибровка специфических мониторов (Eizo / NEC ColorEdge — у них свои протоколы)</li>\n</ul>", "search": "35. многомониторные конфигурации и калибровка экрана \nстандартный запрос фотографа/дизайнера/трейдера: «помоги настроить 2-3 монитора + откалибровать под цветопередачу».\n\n**многомониторная настройка:**\n\n1. **проверка выходов видеокарты** — современные имеют 1-3 displayport + 1 hdmi. на бюджетных видеокартах обычно 2 выхода, на средних 3-4. нужна модель с нужным числом выходов\n2. **кабели** — displayport лучше hdmi (выше частота обновления, меньше задержка). vga забыть — устарел\n3. **настройка** — win+p → выбрать «расширить экран». правой кнопкой на рабочем столе → «параметры экрана» → расположить мониторы по физическому расположению на столе\n4. **разные разрешения** — windows сам подстроит масштабирование. но текст может выглядеть размыто на старом мониторе — лучше одинаковое разрешение\n\n**калибровка цвета (для фотографов/дизайнеров):**\n\n- **базовая калибровка глазом** — встроенная утилита `dccw.exe` (win+r → dccw). бесплатно, занимает 5 минут. достаточно для офиса\n- **профессиональная калибровка колориметром** — нужен прибор (x-rite i1 display pro, datacolor spyderx). цена 15-25 тыс. услуга мастера с прибором — 2000-3000₽ за один монитор + создание профиля icc\n\n**что не браться без оборудования:**\n- печать-калибровка (синхронизация экрана с принтером — нужны спектрофотометр + опыт)\n- калибровка специфических мониторов (eizo / nec coloredge — у них свои протоколы)\n"}, {"title": "36. Linux у клиента — что можно, что НЕ браться", "cat": "G. Доступ / система", "html": "<p>5-10% домашних пользователей в РФ на Linux (Mint, Ubuntu, Fedora, реже Manjaro/Arch). Обычно это <strong>технари сами умеют</strong> — но иногда нужна помощь.</p>\n<h3>Что МОЖНО делать с Linux</h3>\n<table><thead><tr><th>Услуга</th><th>Цена</th><th>Сложность</th></tr></thead><tbody><tr><td><strong>Установка Linux Mint / Ubuntu</strong> (с нуля или рядом с Windows)</td><td>2500-3500₽</td><td>средне</td></tr><tr><td><strong>Восстановление загрузчика GRUB</strong> (после установки Windows на дуал-бут)</td><td>2000₽</td><td>средне</td></tr><tr><td><strong>Перенос данных Windows → Linux</strong></td><td>1500₽</td><td>просто</td></tr><tr><td><strong>Базовая настройка</strong> (Wi-Fi, принтер, шрифты, кодеки, Telegram, Steam через Proton)</td><td>1500-2500₽</td><td>просто-средне</td></tr><tr><td><strong>Установка драйверов NVIDIA</strong> (если нужен Proprietary для игр)</td><td>1000₽</td><td>просто</td></tr><tr><td><strong>Помощь с обновлением системы</strong> (sudo apt update / dnf upgrade)</td><td>800₽</td><td>просто</td></tr><tr><td><strong>Раздел диска под dual-boot</strong> (GParted Live)</td><td>1500₽</td><td>средне</td></tr></tbody></table>\n<h3>Что НЕ браться без опыта</h3>\n<ul>\n<li>Серверный Linux (Debian server, CentOS) — это уже сисадмин, не домашний мастер</li>\n<li>Arch/Gentoo с кастомным WM — пользователь сам разберётся быстрее</li>\n<li>ZFS/btrfs восстановление — узкая специальность</li>\n<li>Сложный systemd-troubleshooting</li>\n</ul>\n<h3>Live Linux USB — главный универсальный инструмент мастера</h3>\n<p><strong>Сценарий:</strong> клиент звонит «Windows не грузится, на ПК важные документы и фото». Восстановление через Windows — может затереть. <strong>Live Linux</strong> загружается с флешки, видит NTFS-разделы Windows и копирует файлы на внешний диск.</p>\n<p><strong>Что нужно:</strong></p>\n<ul>\n<li><strong>Флешка с Ventoy</strong> + один из:</li>\n<li><strong>Ubuntu LTS Live</strong> (~3-4 ГБ ISO) — самый дружелюбный, видит NTFS «из коробки» через ntfs-3g</li>\n<li><strong>Linux Mint Live</strong> (~2-3 ГБ) — простой интерфейс, всё работает</li>\n<li><strong>SystemRescue</strong> (~700 МБ) — специализированный для восстановления, командная строка</li>\n<li>Внешний HDD/SSD клиента (на его флешку, не на свою)</li>\n</ul>\n<p><strong>Алгоритм:</strong></p>\n<ul>\n<li>Загрузиться с Live USB (F11 / F12 / F8 в BIOS на разных моделях)</li>\n<li>Открыть Files / Nautilus</li>\n<li>В sidebar — все диски Windows (помечены как «N GB Filesystem»)</li>\n<li>Mount двойным кликом</li>\n<li>Скопировать <code>/run/media/.../Users/&lt;имя&gt;/</code> на внешний носитель</li>\n<li><strong>Спросить клиента про нестандартные папки</strong> (см. кейс 25 «Полный бэкап»)</li>\n<li>Размонтировать, выключить, отдать</li>\n</ul>\n<p><strong>Цена услуги:</strong> <strong>2000-3500₽</strong> (восстановление данных через Live Linux).</p>\n<h3>Скрипт разговора если клиент про Linux</h3>\n<blockquote>«По Linux я делаю установку, базовую настройку, перенос данных с Windows. Если задача сложная — посмотри, может справишься сам в Mint, он очень понятный. Серверные дистрибутивы / Arch — не моё, направлю в специализированный сервис.»</blockquote>", "search": "36. linux у клиента — что можно, что не браться \n5-10% домашних пользователей в рф на linux (mint, ubuntu, fedora, реже manjaro/arch). обычно это **технари сами умеют** — но иногда нужна помощь.\n\n### что можно делать с linux\n\n| услуга | цена | сложность |\n|---|---|---|\n| **установка linux mint / ubuntu** (с нуля или рядом с windows) | 2500-3500₽ | средне |\n| **восстановление загрузчика grub** (после установки windows на дуал-бут) | 2000₽ | средне |\n| **перенос данных windows → linux** | 1500₽ | просто |\n| **базовая настройка** (wi-fi, принтер, шрифты, кодеки, telegram, steam через proton) | 1500-2500₽ | просто-средне |\n| **установка драйверов nvidia** (если нужен proprietary для игр) | 1000₽ | просто |\n| **помощь с обновлением системы** (sudo apt update / dnf upgrade) | 800₽ | просто |\n| **раздел диска под dual-boot** (gparted live) | 1500₽ | средне |\n\n### что не браться без опыта\n\n- серверный linux (debian server, centos) — это уже сисадмин, не домашний мастер\n- arch/gentoo с кастомным wm — пользователь сам разберётся быстрее\n- zfs/btrfs восстановление — узкая специальность\n- сложный systemd-troubleshooting\n\n### live linux usb — главный универсальный инструмент мастера\n\n**сценарий:** клиент звонит «windows не грузится, на пк важные документы и фото». восстановление через windows — может затереть. **live linux** загружается с флешки, видит ntfs-разделы windows и копирует файлы на внешний диск.\n\n**что нужно:**\n1. **флешка с ventoy** + один из:\n   - **ubuntu lts live** (~3-4 гб iso) — самый дружелюбный, видит ntfs «из коробки» через ntfs-3g\n   - **linux mint live** (~2-3 гб) — простой интерфейс, всё работает\n   - **systemrescue** (~700 мб) — специализированный для восстановления, командная строка\n2. внешний hdd/ssd клиента (на его флешку, не на свою)\n\n**алгоритм:**\n\n1. загрузиться с live usb (f11 / f12 / f8 в bios на разных моделях)\n2. открыть files / nautilus\n3. в sidebar — все диски windows (помечены как «n gb filesystem»)\n4. mount двойным кликом\n5. скопировать `/run/media/.../users/<имя>/` на внешний носитель\n6. **спросить клиента про нестандартные папки** (см. кейс 25 «полный бэкап»)\n7. размонтировать, выключить, отдать\n\n**цена услуги:** **2000-3500₽** (восстановление данных через live linux).\n\n### скрипт разговора если клиент про linux\n\n> «по linux я делаю установку, базовую настройку, перенос данных с windows. если задача сложная — посмотри, может справишься сам в mint, он очень понятный. серверные дистрибутивы / arch — не моё, направлю в специализированный сервис.»\n"}, {"title": "37. MacBook — границы возможного", "cat": "G. Доступ / система", "html": "<p>Apple — отдельный мир. <strong>Внутрь технику не лезем чинить, а вот с внешними задачами (перенос данных, чистка, настройка) помогаем.</strong></p>\n<h3>Что МОЖНО делать с MacBook</h3>\n<table><thead><tr><th>Услуга</th><th>Цена</th><th>Условия</th></tr></thead><tbody><tr><td><strong>Перенос данных</strong> (старый Mac → новый или Mac → Win)</td><td>1500-2500₽</td><td>Time Machine / AirDrop / iCloud</td></tr><tr><td><strong>Базовая чистка от пыли</strong> (десктоп iMac / старые MacBook Pro 2012-2015 с обычными винтами)</td><td>2500-4000₽</td><td>НЕ Pro/Air 2016+ (там пайка)</td></tr><tr><td><strong>Замена SSD на MacBook 2010-2015</strong> (классические модели с обычным разъёмом)</td><td>2500₽ + SSD</td><td>Только до 2015. Pro/Air 2016+ — SSD впаян</td></tr><tr><td><strong>Замена RAM на iMac / MacBook 2010-2014</strong></td><td>1500₽ + память</td><td>DDR3 SO-DIMM. Новые — впаяна</td></tr><tr><td><strong>Создание загрузочной флешки macOS</strong></td><td>1500₽</td><td>Через <code>createinstallmedia</code> или диск восстановления Internet Recovery</td></tr><tr><td><strong>Сброс пароля через Apple ID</strong></td><td>1000₽</td><td>Если у клиента есть Apple ID и пароль от него</td></tr><tr><td><strong>Установка софта</strong> (Word, Telegram, GIMP, Skype)</td><td>800-1500₽</td><td>По прайсу клиентского времени</td></tr><tr><td><strong>Настройка для пожилых</strong> на Mac (большие иконки, простое меню)</td><td>1500₽</td><td>macOS Accessibility</td></tr><tr><td><strong>Консультация — что не так с Mac</strong></td><td>800₽</td><td>Диагностика без ремонта</td></tr></tbody></table>\n<h3>Что КАТЕГОРИЧЕСКИ НЕ браться</h3>\n<ul>\n<li><strong>Любая пайка</strong> — все Mac 2016+ имеют BGA процессор + впаянный SSD + впаянная память</li>\n<li><strong>Замена клавиатуры butterfly</strong> (MacBook Pro 2016-2019) — требует разборки всей верхней крышки</li>\n<li><strong>Замена матрицы</strong> — оригинальные дорогие (от 25 тыс), не-оригинальные часто не работают (True Tone)</li>\n<li><strong>Установка Windows через Boot Camp</strong> на M1/M2/M3 Mac — невозможно (ARM)</li>\n<li><strong>Перепрошивка EFI / NVRAM сброс</strong> при подозрении на залоченный (украденный) Mac — статья</li>\n<li><strong>Любой ремонт MacBook залитого жидкостью</strong> — почти наверняка в Apple-сервис</li>\n</ul>\n<h3>Скрипт разговора для MacBook</h3>\n<blockquote>«По Mac я делаю программную часть и базовое железо — перенос данных, чистка пыли, иногда замена SSD и памяти если модель старая (2010-2015). Современные Pro и Air — там всё впаяно, ремонтом не занимаюсь. Знаю проверенный Mac-сервис в [район], могу дать контакт.»</blockquote>\n<p><strong>Найди в своём городе 1-2 Mac-сервиса</strong> и держи контакты — это твой реферальный поток. Им достаются простые программные клиенты, которые им самим неинтересны. А тебе — направления на сложный hardware, который они не берут.</p>\n<p>---</p>", "search": "37. macbook — границы возможного \napple — отдельный мир. **внутрь технику не лезем чинить, а вот с внешними задачами (перенос данных, чистка, настройка) помогаем.**\n\n### что можно делать с macbook\n\n| услуга | цена | условия |\n|---|---|---|\n| **перенос данных** (старый mac → новый или mac → win) | 1500-2500₽ | time machine / airdrop / icloud |\n| **базовая чистка от пыли** (десктоп imac / старые macbook pro 2012-2015 с обычными винтами) | 2500-4000₽ | не pro/air 2016+ (там пайка) |\n| **замена ssd на macbook 2010-2015** (классические модели с обычным разъёмом) | 2500₽ + ssd | только до 2015. pro/air 2016+ — ssd впаян |\n| **замена ram на imac / macbook 2010-2014** | 1500₽ + память | ddr3 so-dimm. новые — впаяна |\n| **создание загрузочной флешки macos** | 1500₽ | через `createinstallmedia` или диск восстановления internet recovery |\n| **сброс пароля через apple id** | 1000₽ | если у клиента есть apple id и пароль от него |\n| **установка софта** (word, telegram, gimp, skype) | 800-1500₽ | по прайсу клиентского времени |\n| **настройка для пожилых** на mac (большие иконки, простое меню) | 1500₽ | macos accessibility |\n| **консультация — что не так с mac** | 800₽ | диагностика без ремонта |\n\n### что категорически не браться\n\n- **любая пайка** — все mac 2016+ имеют bga процессор + впаянный ssd + впаянная память\n- **замена клавиатуры butterfly** (macbook pro 2016-2019) — требует разборки всей верхней крышки\n- **замена матрицы** — оригинальные дорогие (от 25 тыс), не-оригинальные часто не работают (true tone)\n- **установка windows через boot camp** на m1/m2/m3 mac — невозможно (arm)\n- **перепрошивка efi / nvram сброс** при подозрении на залоченный (украденный) mac — статья\n- **любой ремонт macbook залитого жидкостью** — почти наверняка в apple-сервис\n\n### скрипт разговора для macbook\n\n> «по mac я делаю программную часть и базовое железо — перенос данных, чистка пыли, иногда замена ssd и памяти если модель старая (2010-2015). современные pro и air — там всё впаяно, ремонтом не занимаюсь. знаю проверенный mac-сервис в [район], могу дать контакт.»\n\n**найди в своём городе 1-2 mac-сервиса** и держи контакты — это твой реферальный поток. им достаются простые программные клиенты, которые им самим неинтересны. а тебе — направления на сложный hardware, который они не берут.\n\n---\n"}, {"title": "38. Сертификации — куда расти технически", "cat": "G. Доступ / система", "html": "<p>После 50-100 клиентов и года практики — пора думать про сертификации, чтобы выйти на корпоративный рынок и поднять цены.</p>\n<p><strong>Доступные сертификации в РФ 2026:</strong></p>\n<table><thead><tr><th>Сертификат</th><th>Уровень</th><th>Цена</th><th>Что даёт</th></tr></thead><tbody><tr><td><strong>CompTIA A+</strong></td><td>Базовая по железу</td><td>$200-300 (3-4 экзамена)</td><td>Международный стандарт ПК-мастера. Признаётся IT-отделами</td></tr><tr><td><strong>CompTIA Network+</strong></td><td>Сети</td><td>$300</td><td>Корпоративные сетевые работы</td></tr><tr><td><strong>1С: Профессионал</strong></td><td>Для админов 1С</td><td>5-10 тыс ₽</td><td>Огромный рынок в РФ — настройка 1С</td></tr><tr><td><strong>Microsoft MTA</strong> (если ещё есть)</td><td>По Windows</td><td>$100</td><td>Слабая, но «бумажка есть»</td></tr><tr><td><strong>AWS Cloud Practitioner / Azure Fundamentals</strong></td><td>Облака</td><td>$100</td><td>Облачная работа</td></tr><tr><td><strong>Cisco CCNA</strong></td><td>Сложные сети</td><td>30+ тыс ₽</td><td>Серьёзный шаг в сисадмины</td></tr></tbody></table>\n<p><strong>Реалистичный путь развития:</strong></p>\n<ul>\n<li><strong>Сначала практика</strong> — год чистой работы, 100+ клиентов, понимание реальных проблем</li>\n<li><strong>CompTIA A+</strong> — если хочешь работать с корпоративными клиентами и претендовать на 100+ тыс/мес</li>\n<li><strong>1С: Профессионал</strong> — если планируешь обслуживать малый/средний бизнес в РФ</li>\n<li><strong>Профильное</strong> — выбрать одну специализацию (сети / админ Linux / DevOps) и пойти глубже</li>\n</ul>\n<p><strong>Кратко:</strong> сертификации не нужны на старте. Они становятся актуальны когда хочешь поднять цены и выйти из B2C в B2B.</p>", "search": "38. сертификации — куда расти технически \nпосле 50-100 клиентов и года практики — пора думать про сертификации, чтобы выйти на корпоративный рынок и поднять цены.\n\n**доступные сертификации в рф 2026:**\n\n| сертификат | уровень | цена | что даёт |\n|---|---|---|---|\n| **comptia a+** | базовая по железу | $200-300 (3-4 экзамена) | международный стандарт пк-мастера. признаётся it-отделами |\n| **comptia network+** | сети | $300 | корпоративные сетевые работы |\n| **1с: профессионал** | для админов 1с | 5-10 тыс ₽ | огромный рынок в рф — настройка 1с |\n| **microsoft mta** (если ещё есть) | по windows | $100 | слабая, но «бумажка есть» |\n| **aws cloud practitioner / azure fundamentals** | облака | $100 | облачная работа |\n| **cisco ccna** | сложные сети | 30+ тыс ₽ | серьёзный шаг в сисадмины |\n\n**реалистичный путь развития:**\n\n1. **сначала практика** — год чистой работы, 100+ клиентов, понимание реальных проблем\n2. **comptia a+** — если хочешь работать с корпоративными клиентами и претендовать на 100+ тыс/мес\n3. **1с: профессионал** — если планируешь обслуживать малый/средний бизнес в рф\n4. **профильное** — выбрать одну специализацию (сети / админ linux / devops) и пойти глубже\n\n**кратко:** сертификации не нужны на старте. они становятся актуальны когда хочешь поднять цены и выйти из b2c в b2b.\n"}, {"title": "39. AI-консультация на визите — короткая шпаргалка", "cat": "G. Доступ / система", "html": "<p>Verus с v0.2.0 имеет встроенного AI-помощника. Полная теория — в учебном модуле <code>training/10-AI-помощник.docx</code> или кнопка «🤖 AI-помощник в работе» во вкладке «Обучение». Здесь — рабочая шпаргалка.</p>\n<p><strong>Когда использовать на визите:</strong></p>\n<ul>\n<li>Сложный/необычный случай — спросить второе мнение</li>\n<li>Объяснить клиенту в его словах — режим «Текст для клиента»</li>\n<li>План работ сложного визита — режим «План работ»</li>\n<li>Конкретный код ошибки или непонятный лог — режим «Свободный вопрос»</li>\n</ul>\n<p><strong>Алгоритм за 30 секунд:</strong></p>\n<ul>\n<li>Дашборд → 🤖 Спросить ИИ</li>\n<li>Выбери таб: 🩺 Health-check / 📋 План / 💬 Клиенту / ❓ Свой вопрос</li>\n<li>🚀 Запросить → 10-30 сек ожидания</li>\n<li>Прочитай (НЕ копируй не глядя — AI бывает уверенно неправ)</li>\n<li>Если ответ не понравился — 🔄 Re-run на другой модели</li>\n</ul>\n<p><strong>Деньги:</strong> один запрос ≈ $0.002-0.005. Дневной лимит $1 (≈ 400 запросов). Бар usage есть в Настройках → 🤖 ИИ-ассистент.</p>\n<p><strong>Что AI ПО НЕЛЬЗЯ:</strong></p>\n<ul>\n<li>Слепо отправлять результат «Текст клиенту» — прочитай, может быть слишком категорично</li>\n<li>Слушать когда уверенно говорит про точную цену или конкретную модель железа (часто ошибается)</li>\n<li>Нажимать кнопку из блока «🛠 Действия по совету ИИ» если AI пишет «не делай X» рядом</li>\n<li>Использовать как замену головы — AI это второе мнение, не первое</li>\n</ul>\n<p><strong>Этика с клиентом:</strong> если клиент спросил «что это» — ответь честно. «Использую AI чтобы проверить себя. Имя, телефон не отправляются, только технические метрики ПК.»</p>\n<p><strong>Если случай редкий — продолжить разговор:</strong></p>\n<ul>\n<li>После первого ответа кнопка ↩ «Продолжить разговор»</li>\n<li>Можешь задавать follow-up: «а если рассмотреть вариант X?» — AI помнит предыдущее</li>\n<li>🆕 «Новый разговор» — сброс при смене темы или клиента</li>\n</ul>\n<p><strong>Если AI зависает:</strong></p>\n<ul>\n<li>Streaming (чекбокс «Streaming» в модалке) — текст идёт по мере генерации</li>\n<li>Если завис на 2+ минуты — закрой модалку (это отменит запрос), попробуй другую модель</li>\n</ul>\n<p>---</p>", "search": "39. ai-консультация на визите — короткая шпаргалка \nverus с v0.2.0 имеет встроенного ai-помощника. полная теория — в учебном модуле `training/10-ai-помощник.docx` или кнопка «🤖 ai-помощник в работе» во вкладке «обучение». здесь — рабочая шпаргалка.\n\n**когда использовать на визите:**\n- сложный/необычный случай — спросить второе мнение\n- объяснить клиенту в его словах — режим «текст для клиента»\n- план работ сложного визита — режим «план работ»\n- конкретный код ошибки или непонятный лог — режим «свободный вопрос»\n\n**алгоритм за 30 секунд:**\n1. дашборд → 🤖 спросить ии\n2. выбери таб: 🩺 health-check / 📋 план / 💬 клиенту / ❓ свой вопрос\n3. 🚀 запросить → 10-30 сек ожидания\n4. прочитай (не копируй не глядя — ai бывает уверенно неправ)\n5. если ответ не понравился — 🔄 re-run на другой модели\n\n**деньги:** один запрос ≈ $0.002-0.005. дневной лимит $1 (≈ 400 запросов). бар usage есть в настройках → 🤖 ии-ассистент.\n\n**что ai по нельзя:**\n- слепо отправлять результат «текст клиенту» — прочитай, может быть слишком категорично\n- слушать когда уверенно говорит про точную цену или конкретную модель железа (часто ошибается)\n- нажимать кнопку из блока «🛠 действия по совету ии» если ai пишет «не делай x» рядом\n- использовать как замену головы — ai это второе мнение, не первое\n\n**этика с клиентом:** если клиент спросил «что это» — ответь честно. «использую ai чтобы проверить себя. имя, телефон не отправляются, только технические метрики пк.»\n\n**если случай редкий — продолжить разговор:**\n- после первого ответа кнопка ↩ «продолжить разговор»\n- можешь задавать follow-up: «а если рассмотреть вариант x?» — ai помнит предыдущее\n- 🆕 «новый разговор» — сброс при смене темы или клиента\n\n**если ai зависает:**\n- streaming (чекбокс «streaming» в модалке) — текст идёт по мере генерации\n- если завис на 2+ минуты — закрой модалку (это отменит запрос), попробуй другую модель\n\n---\n"}, {"title": "Cheat-sheet команд (часто нужны)", "cat": "", "html": "<pre>sfc /scannow                                  — проверка/починка системных файлов\nDISM /Online /Cleanup-Image /RestoreHealth    — починка хранилища компонентов\nchkdsk C: /f /r                               — проверка диска (долго, с перезагрузкой)\nbootrec /fixmbr | /fixboot | /rebuildbcd      — восстановление загрузчика (среда восст.)\nbcdboot C:\\Windows                            — пересоздать загрузку (UEFI)\nipconfig /flushdns                            — сброс кэша DNS\nnetsh winsock reset &amp; netsh int ip reset      — сброс сети (нужна перезагрузка)\ncleanmgr й ноутбук с коррозией — сервис с оборудованием.\n- сложный raid/сервер, шифрование bitlocker без ключа.\n- не уверен и риск потерять данные клиента — лучше честно сказать и направить, чем угробить.\n\n> принцип: **сначала данные, потом всё остальное.** не знаешь — не пиши на диск, сделай копию/образ, спроси справочник, и только потом действуй.\n"}];
var list=document.getElementById('list'), q=document.getElementById('q'), count=document.getElementById('count');
function build(){
  list.innerHTML='';
  CARDS.forEach(function(c,i){
    var d=document.createElement('div'); d.className='card'; d.setAttribute('data-s',c.search);
    d.innerHTML='<div class="head">'+(c.cat?'<span class="cat">'+c.cat+'</span>':'')+'<span class="htitle">'+c.title+'</span><span class="chev">▸</span></div><div class="body">'+c.html+'</div>';
    d.querySelector('.head').onclick=function(){ d.classList.toggle('open'); };
    list.appendChild(d);
  });
}
function filter(){
  var v=q.value.trim().toLowerCase(), terms=v.split(/\s+/).filter(Boolean), n=0;
  document.querySelectorAll('.card').forEach(function(d){
    var s=d.getAttribute('data-s');
    var ok = terms.every(function(t){ return s.indexOf(t)>=0; });
    d.classList.toggle('hidden', !ok);
    if(ok){ n++; if(v) d.classList.add('open'); else d.classList.remove('open'); }
  });
  count.textContent = v ? (n+' совпадений') : (CARDS.length+' случаев — начни печатать симптом');
}
build(); q.addEventListener('input',filter); filter();
</script></body></html>
