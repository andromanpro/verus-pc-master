<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Полевой справочник мастера ПК</title>
<style>
 :root{--bg:#0A0E17;--card:rgba(21,29,48,.72);--bd:#26314d;--cy:#22d3ee;--mt:#34d399;--am:#fbbf24;--rs:#fb7185;--tx:#f8fafc;--mu:#94a3b8}
 *{box-sizing:border-box;margin:0;padding:0}
 body{background:var(--bg);color:var(--tx);font-family:Segoe UI,Roboto,Arial,sans-serif;min-height:100vh}
 .bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(60vw 60vw at 10% -10%,rgba(34,211,238,.10),transparent 60%),radial-gradient(55vw 55vw at 110% 115%,rgba(247,37,133,.09),transparent 60%)}
 header{padding:30px 36px 8px}
 .eyebrow{font-family:Consolas,monospace;color:var(--cy);letter-spacing:3px;font-size:12px}
 h1{font-size:26px;margin-top:6px}
 .wrap{padding:14px 36px 50px;max-width:1100px}
 .search{position:sticky;top:0;background:linear-gradient(var(--bg),var(--bg) 70%,transparent);padding:12px 0 14px;z-index:5}
 #q{width:100%;padding:14px 18px;font-size:16px;border-radius:12px;border:1px solid var(--bd);background:#121a2e;color:var(--tx);outline:none}
 #q:focus{border-color:var(--cy);box-shadow:0 0 18px rgba(34,211,238,.18)}
 .count{color:var(--mu);font-size:13px;margin:4px 2px 10px}
 .card{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:12px;overflow:hidden}
 .card.hidden{display:none}
 .head{padding:15px 18px;cursor:pointer;display:flex;align-items:center;gap:12px}
 .head:hover{background:rgba(34,211,238,.05)}
 .cat{font-family:Consolas,monospace;font-size:11px;color:var(--am);border:1px solid var(--bd);border-radius:6px;padding:2px 8px;white-space:nowrap}
 .htitle{font-size:16px;font-weight:700;flex:1}
 .chev{color:var(--mu);transition:.2s}
 .card.open .chev{transform:rotate(90deg)}
 .body{display:none;padding:2px 20px 18px;color:#dbe3f0}
 .card.open .body{display:block}
 .body p{margin:8px 0;line-height:1.55}
 .body ul{margin:8px 0 8px 4px;list-style:none}
 .body li{position:relative;padding:4px 0 4px 20px;line-height:1.5}
 .body li:before{content:"▸";color:var(--cy);position:absolute;left:0}
 .body code{font-family:Consolas,monospace;background:#0c1424;border:1px solid var(--bd);border-radius:5px;padding:1px 6px;color:var(--mt);font-size:13px}
 .body pre{background:#0b1220;border:1px solid var(--bd);border-left:3px solid var(--cy);border-radius:8px;padding:12px 14px;margin:10px 0;overflow-x:auto;font-family:Consolas,monospace;font-size:13px;color:#cfe;line-height:1.5}
 .body blockquote{border-left:3px solid var(--am);background:rgba(251,191,36,.07);padding:8px 14px;margin:10px 0;border-radius:6px;color:#f3e6c8}
 .body strong{color:#fff}
 .body h3,.body h4,.body h5{color:var(--cy);margin:14px 0 6px;font-size:15px;font-weight:700}
 .body h4,.body h5{font-size:14px;color:#dbe3f0}
 .body table{border-collapse:collapse;width:100%;margin:10px 0;font-size:13px}
 .body th,.body td{border:1px solid var(--bd);padding:6px 9px;text-align:left;vertical-align:top}
 .body th{background:rgba(34,211,238,.10);color:var(--cy)}
 footer{color:var(--mu);font-size:12px;padding:0 36px 30px}
</style></head><body>
<div class="bg"></div>
<header><div class="eyebrow">БАЗА ЗНАНИЙ МАСТЕРА · ПОИСК ПО СИМПТОМУ</div><h1>Полевой справочник мастера ПК</h1></header>
<div class="wrap">
 <div class="search"><input id="q" placeholder="Опиши проблему: тормозит, нет звука, синий экран, не грузится..." autofocus></div>
 <div class="count" id="count"></div>
 <div id="list"></div>
</div>
<footer>Открывается с флешки, без интернета. Полный текст — справочник-мастера.md. Сначала данные, потом всё остальное.</footer>
<script>
const CARDS = [{"title": "3 железных правила (всегда)", "cat": "", "html": "<ul>\n<li><strong>Сначала бэкап данных.</strong> Перед любым серьёзным действием — копия важного на ДРУГОЙ носитель (<code>../скрипты/</code> → backup).</li>\n<li><strong>Сыпется диск — не мучай.</strong> Стук/щелчки/пропадает — выключи, снимай образ (ddrescue) или в лабораторию. Каждое включение убивает шансы.</li>\n<li><strong>Показывай, а не пугай.</strong> Нашёл проблему — показал её на экране. Цену назвал заранее.</li>\n</ul>", "search": "3 железных правила (всегда) 1. **сначала бэкап данных.** перед любым серьёзным действием — копия важного на другой носитель (`../скрипты/` → backup).\n2. **сыпется диск — не мучай.** стук/щелчки/пропадает — выключи, снимай образ (ddrescue) или в лабораторию. каждое включение убивает шансы.\n3. **показывай, а не пугай.** нашёл проблему — показал её на экране. цену назвал заранее.\n"}, {"title": "Золотой порядок диагностики (с этого начинай почти всегда)", "cat": "", "html": "<ul>\n<li>Спроси: что случилось, когда, что менялось перед этим. Есть ли важные данные.</li>\n<li>Внешне: пыль, запах гари, вздутые конденсаторы, шлейфы, индикаторы.</li>\n<li>Запусти <code>../дашборд/Диагностика.bat</code> (от админа) — сразу видно железо, диски, SMART, температуры, что грузит.</li>\n<li>Дальше — по конкретному случаю ниже.</li>\n</ul>\n<p>---</p>", "search": "золотой порядок диагностики (с этого начинай почти всегда) 1. спроси: что случилось, когда, что менялось перед этим. есть ли важные данные.\n2. внешне: пыль, запах гари, вздутые конденсаторы, шлейфы, индикаторы.\n3. запусти `../дашборд/диагностика.bat` (от админа) — сразу видно железо, диски, smart, температуры, что грузит.\n4. дальше — по конкретному случаю ниже.\n\n---\n"}, {"title": "1. Не включается совсем (нет признаков жизни)", "cat": "A. Не работает / не стартует", "html": "<ul>\n<li><strong>Симптом:</strong> не реагирует на кнопку, нет вентиляторов/света.</li>\n<li><strong>Шаги:</strong> 1) розетка/удлинитель/кнопка на БП (положение I). 2) Кабель питания плотно. 3) ПК: переключатель БП, кнопка перезапуска БП; ноут: вынуть батарею (если съёмная), держать power 20 сек, подключить зарядку — смотреть индикатор зарядки. 4) ПК: одна планка памяти, сброс CMOS (вынуть батарейку CR2032 на 1 мин). 5) Пробный заведомо рабочий БП (ПК) / зарядку (ноут).</li>\n<li><strong>Звать/лаба:</strong> не стартует после БП и сброса CMOS → вероятно мать/БП; замена/диагностика на стенде.</li>\n<li><strong>Клиенту:</strong> «Питание не доходит. Проверю блок питания и плату; если плата — это отдельный разговор по цене.»</li>\n</ul>", "search": "1. не включается совсем (нет признаков жизни) - **симптом:** не реагирует на кнопку, нет вентиляторов/света.\n- **шаги:** 1) розетка/удлинитель/кнопка на бп (положение i). 2) кабель питания плотно. 3) пк: переключатель бп, кнопка перезапуска бп; ноут: вынуть батарею (если съёмная), держать power 20 сек, подключить зарядку — смотреть индикатор зарядки. 4) пк: одна планка памяти, сброс cmos (вынуть батарейку cr2032 на 1 мин). 5) пробный заведомо рабочий бп (пк) / зарядку (ноут).\n- **звать/лаба:** не стартует после бп и сброса cmos → вероятно мать/бп; замена/диагностика на стенде.\n- **клиенту:** «питание не доходит. проверю блок питания и плату; если плата — это отдельный разговор по цене.»\n"}, {"title": "2. Включается, но нет изображения", "cat": "A. Не работает / не стартует", "html": "<ul>\n<li><strong>Симптом:</strong> кулеры крутятся, экран чёрный, нет сигнала.</li>\n<li><strong>Шаги:</strong> 1) Монитор: питание, вход (HDMI/DP), кабель. 2) Видеовыход: если есть встроенное видео — воткни в МАТЬ, не в видеокарту (проверить видеокарту). 3) Память: переставить/одну планку, другой слот. 4) Сброс CMOS. 5) Слушать сигналы спикера/коды POST.</li>\n<li><strong>Тулзы:</strong> при старте — GPU-Z потом подтвердит видеокарту.</li>\n<li><strong>Клиенту:</strong> «Сигнал на экран не идёт, обычно виновата память или видеокарта. Сейчас разберусь, что именно.»</li>\n</ul>", "search": "2. включается, но нет изображения - **симптом:** кулеры крутятся, экран чёрный, нет сигнала.\n- **шаги:** 1) монитор: питание, вход (hdmi/dp), кабель. 2) видеовыход: если есть встроенное видео — воткни в мать, не в видеокарту (проверить видеокарту). 3) память: переставить/одну планку, другой слот. 4) сброс cmos. 5) слушать сигналы спикера/коды post.\n- **тулзы:** при старте — gpu-z потом подтвердит видеокарту.\n- **клиенту:** «сигнал на экран не идёт, обычно виновата память или видеокарта. сейчас разберусь, что именно.»\n"}, {"title": "3. Не загружается Windows (загрузчик/«No bootable device»/крутится бесконечно)", "cat": "A. Не работает / не стартует", "html": "<ul>\n<li><strong>Симптом:</strong> до рабочего стола не доходит, ошибка загрузки, лого крутится.</li>\n<li><strong>Шаги:</strong> 1) BIOS: виден ли диск, верный порядок загрузки. 2) Загрузись с флешки (Hiren&#x27;s). 3) Проверь диск (CrystalDiskInfo/Victoria) — если сыпется, см. п.17. 4) Восстановление загрузчика (среда восстановления / Hiren&#x27;s).</li>\n<li><strong>Команды (из среды восстановления, cmd):</strong></li>\n</ul>\n<pre>  bootrec /fixmbr\n  bootrec /fixboot\n  bootrec /scanos\n  bootrec /rebuildbcd</pre>\n<p>  Если /fixboot = «Отказано в доступе» (UEFI): <code>bcdboot C:\\Windows</code> (где C: — раздел Windows).</p>\n<ul>\n<li><strong>Звать/лаба:</strong> диск исправен, но загрузчик не чинится → проще переустановка (после бэкапа).</li>\n<li><strong>Клиенту:</strong> «Система не стартует. Сначала спасу данные, потом восстановлю загрузку или переставлю.»</li>\n</ul>", "search": "3. не загружается windows (загрузчик/«no bootable device»/крутится бесконечно) - **симптом:** до рабочего стола не доходит, ошибка загрузки, лого крутится.\n- **шаги:** 1) bios: виден ли диск, верный порядок загрузки. 2) загрузись с флешки (hiren's). 3) проверь диск (crystaldiskinfo/victoria) — если сыпется, см. п.17. 4) восстановление загрузчика (среда восстановления / hiren's).\n- **команды (из среды восстановления, cmd):**\n  ```\n  bootrec /fixmbr\n  bootrec /fixboot\n  bootrec /scanos\n  bootrec /rebuildbcd\n  ```\n  если /fixboot = «отказано в доступе» (uefi): `bcdboot c:\\windows` (где c: — раздел windows).\n- **звать/лаба:** диск исправен, но загрузчик не чинится → проще переустановка (после бэкапа).\n- **клиенту:** «система не стартует. сначала спасу данные, потом восстановлю загрузку или переставлю.»\n"}, {"title": "4. Синий экран (BSOD)", "cat": "A. Не работает / не стартует", "html": "<ul>\n<li><strong>Симптом:</strong> синий экран с кодом (напр. <code>MEMORY_MANAGEMENT</code>, <code>WHEA_UNCORRECTABLE_ERROR</code>).</li>\n<li><strong>Шаги:</strong> 1) Запиши/сфоткай <strong>код ошибки</strong>. 2) Что менялось перед этим (драйвер, железо, разгон). 3) Память — <code>MemTest86+</code> ночь. 4) Диск — CrystalDiskInfo/chkdsk. 5) Драйверы — обнови через SDIO; недавний драйвер — откати. 6) Перегрев — HWiNFO/OCCT.</li>\n<li><strong>Команды:</strong> <code>sfc /scannow</code> затем <code>DISM /Online /Cleanup-Image /RestoreHealth</code>. Анализ дампа — BlueScreenView (по желанию).</li>\n<li><strong>Клиенту:</strong> «Система падает по причине X (память/диск/драйвер). Проверю и устраню.»</li>\n</ul>", "search": "4. синий экран (bsod) - **симптом:** синий экран с кодом (напр. `memory_management`, `whea_uncorrectable_error`).\n- **шаги:** 1) запиши/сфоткай **код ошибки**. 2) что менялось перед этим (драйвер, железо, разгон). 3) память — `memtest86+` ночь. 4) диск — crystaldiskinfo/chkdsk. 5) драйверы — обнови через sdio; недавний драйвер — откати. 6) перегрев — hwinfo/occt.\n- **команды:** `sfc /scannow` затем `dism /online /cleanup-image /restorehealth`. анализ дампа — bluescreenview (по желанию).\n- **клиенту:** «система падает по причине x (память/диск/драйвер). проверю и устраню.»\n"}, {"title": "5. Постоянно перезагружается / выключается", "cat": "A. Не работает / не стартует", "html": "<ul>\n<li><strong>Симптом:</strong> ребут без BSOD, особенно под нагрузкой.</li>\n<li><strong>Шаги:</strong> 1) Перегрев — HWiNFO (темпы), чистка от пыли + термопаста. 2) БП слабый/старый — OCCT Power test. 3) Память — MemTest86+. 4) Авто-перезагрузка при ошибке: отключить, чтобы увидеть BSOD (Свойства системы → Загрузка и восстановление → снять «Выполнить автоматическую перезагрузку»).</li>\n<li><strong>Клиенту:</strong> «Ловлю причину перезагрузок — чаще перегрев или блок питания.»</li>\n</ul>\n<p>---</p>", "search": "5. постоянно перезагружается / выключается - **симптом:** ребут без bsod, особенно под нагрузкой.\n- **шаги:** 1) перегрев — hwinfo (темпы), чистка от пыли + термопаста. 2) бп слабый/старый — occt power test. 3) память — memtest86+. 4) авто-перезагрузка при ошибке: отключить, чтобы увидеть bsod (свойства системы → загрузка и восстановление → снять «выполнить автоматическую перезагрузку»).\n- **клиенту:** «ловлю причину перезагрузок — чаще перегрев или блок питания.»\n\n---\n"}, {"title": "6. Тормозит, долго грузится", "cat": "B. Медленно / греется", "html": "<ul>\n<li><strong>Симптом:</strong> всё медленно, особенно после включения.</li>\n<li><strong>Шаги:</strong> 1) <strong>Диск</strong> — CrystalDiskInfo (если HDD и/или SMART жёлтый → главный кандидат; апгрейд на SSD, см. п.19). 2) Автозагрузка — <strong>Autoruns</strong> (Sysinternals), вырубить лишнее. 3) Что грузит — System Informer / дашборд. 4) Вирусы/реклама — п.9. 5) Мало места — п.20. 6) Чистка — <code>../скрипты/</code> cleanup (с подтверждением).</li>\n<li><strong>Команды:</strong> <code>sfc /scannow</code>; автозагрузка — <code>Ctrl+Shift+Esc</code> → Автозагрузка.</li>\n<li><strong>Клиенту:</strong> «Главный тормоз обычно старый диск или мусор в автозагрузке. Больше всего ускорит переход на SSD.»</li>\n</ul>", "search": "6. тормозит, долго грузится - **симптом:** всё медленно, особенно после включения.\n- **шаги:** 1) **диск** — crystaldiskinfo (если hdd и/или smart жёлтый → главный кандидат; апгрейд на ssd, см. п.19). 2) автозагрузка — **autoruns** (sysinternals), вырубить лишнее. 3) что грузит — system informer / дашборд. 4) вирусы/реклама — п.9. 5) мало места — п.20. 6) чистка — `../скрипты/` cleanup (с подтверждением).\n- **команды:** `sfc /scannow`; автозагрузка — `ctrl+shift+esc` → автозагрузка.\n- **клиенту:** «главный тормоз обычно старый диск или мусор в автозагрузке. больше всего ускорит переход на ssd.»\n"}, {"title": "7. Перегрев / шумит / выключается под нагрузкой", "cat": "B. Медленно / греется", "html": "<ul>\n<li><strong>Симптом:</strong> горячий, кулеры воют, выключается в играх.</li>\n<li><strong>Шаги:</strong> 1) HWiNFO — температуры CPU/GPU под нагрузкой (&gt;90–95° = плохо). 2) Чистка от пыли (баллон/кисть, не пылесос вплотную). 3) Замена термопасты. 4) OCCT — проверка после. Покажи «до/после» по температурам.</li>\n<li><strong>Клиенту:</strong> «Перегрев из-за пыли/высохшей пасты. Почищу, поменяю пасту — покажу температуры до и после.»</li>\n</ul>", "search": "7. перегрев / шумит / выключается под нагрузкой - **симптом:** горячий, кулеры воют, выключается в играх.\n- **шаги:** 1) hwinfo — температуры cpu/gpu под нагрузкой (>90–95° = плохо). 2) чистка от пыли (баллон/кисть, не пылесос вплотную). 3) замена термопасты. 4) occt — проверка после. покажи «до/после» по температурам.\n- **клиенту:** «перегрев из-за пыли/высохшей пасты. почищу, поменяю пасту — покажу температуры до и после.»\n"}, {"title": "8. Зависает/вылетает в играх", "cat": "B. Медленно / греется", "html": "<ul>\n<li><strong>Симптом:</strong> вылеты, артефакты, фризы только в играх.</li>\n<li><strong>Шаги:</strong> 1) Температуры (п.7). 2) Драйвер видео — чистая переустановка через <strong>DDU</strong> + свежий драйвер. 3) БП (OCCT Power). 4) Память (MemTest86+). 5) Артефакты на экране → видеокарта (GPU-Z, тест).</li>\n<li><strong>Клиенту:</strong> «Разберусь — драйвер видео, перегрев или питание. Начну с чистой переустановки драйвера.»</li>\n</ul>\n<p>---</p>", "search": "8. зависает/вылетает в играх - **симптом:** вылеты, артефакты, фризы только в играх.\n- **шаги:** 1) температуры (п.7). 2) драйвер видео — чистая переустановка через **ddu** + свежий драйвер. 3) бп (occt power). 4) память (memtest86+). 5) артефакты на экране → видеокарта (gpu-z, тест).\n- **клиенту:** «разберусь — драйвер видео, перегрев или питание. начну с чистой переустановки драйвера.»\n\n---\n"}, {"title": "9. Реклама везде, левая стартовая, тулбары", "cat": "C. Вирусы / реклама / ПО", "html": "<ul>\n<li><strong>Симптом:</strong> всплывает реклама, браузер открывает не то.</li>\n<li><strong>Шаги:</strong> 1) <strong>Autoruns</strong> — убрать левое из автозагрузки. 2) Удалить подозрительные программы (Панель управления). 3) Браузер: убрать левые расширения, сбросить стартовую/поиск. 4) Сканеры: Malwarebytes + ESET Online (перекрёстно). 5) Проверить ярлыки браузера (в свойствах в конце не должно быть левого URL).</li>\n<li><strong>Клиенту:</strong> «Покажу, что нашёл и откуда обычно лезет (пиратский софт/«активаторы»). Уберу, и не буду пугать выдуманными тысячами вирусов.»</li>\n</ul>", "search": "9. реклама везде, левая стартовая, тулбары - **симптом:** всплывает реклама, браузер открывает не то.\n- **шаги:** 1) **autoruns** — убрать левое из автозагрузки. 2) удалить подозрительные программы (панель управления). 3) браузер: убрать левые расширения, сбросить стартовую/поиск. 4) сканеры: malwarebytes + eset online (перекрёстно). 5) проверить ярлыки браузера (в свойствах в конце не должно быть левого url).\n- **клиенту:** «покажу, что нашёл и откуда обычно лезет (пиратский софт/«активаторы»). уберу, и не буду пугать выдуманными тысячами вирусов.»\n"}, {"title": "10. Вирус-шифровальщик (ransomware) — ОСОБЫЙ случай", "cat": "C. Вирусы / реклама / ПО", "html": "<ul>\n<li><strong>Симптом:</strong> файлы переименованы/зашифрованы, записка с требованием выкупа.</li>\n<li><strong>Шаги:</strong> 1) <strong>НЕ платить.</strong> 2) <strong>Отключить от сети</strong> (вынуть кабель/Wi-Fi) — чтобы не пошло дальше. 3) Не удалять зашифрованное и записку — нужны для опознания. 4) Опознать по записке/расширению: <code>id-ransomware</code> (сайт), декрипторы на <strong>nomoreransom.org</strong>. 5) Снять копию зашифрованного (вдруг декриптор выйдет позже). 6) Лечить саму заразу сканерами <strong>после</strong> сохранения копий.</li>\n<li><strong>Клиенту:</strong> честно: «Расшифровка возможна не всегда. Платить вымогателям нельзя: часто после оплаты файлы всё равно не возвращают. Проверю, есть ли бесплатный декриптор.»</li>\n</ul>", "search": "10. вирус-шифровальщик (ransomware) — особый случай - **симптом:** файлы переименованы/зашифрованы, записка с требованием выкупа.\n- **шаги:** 1) **не платить.** 2) **отключить от сети** (вынуть кабель/wi-fi) — чтобы не пошло дальше. 3) не удалять зашифрованное и записку — нужны для опознания. 4) опознать по записке/расширению: `id-ransomware` (сайт), декрипторы на **nomoreransom.org**. 5) снять копию зашифрованного (вдруг декриптор выйдет позже). 6) лечить саму заразу сканерами **после** сохранения копий.\n- **клиенту:** честно: «расшифровка возможна не всегда. платить вымогателям нельзя: часто после оплаты файлы всё равно не возвращают. проверю, есть ли бесплатный декриптор.»\n"}, {"title": "11. Не запускаются программы / антивирус отключён / диспетчер заблокирован", "cat": "C. Вирусы / реклама / ПО", "html": "<ul>\n<li><strong>Симптом:</strong> «администратор заблокировал», не открывается реестр/диспетчер.</li>\n<li><strong>Шаги:</strong> 1) Загрузка в безопасном режиме. 2) Сканеры из-под Hiren&#x27;s (оффлайн). 3) <code>sfc /scannow</code>, <code>DISM ... /RestoreHealth</code>. 4) Autoruns — снять блокирующее.</li>\n<li><strong>Клиенту:</strong> «Зловред заблокировал систему. Вылечу из безопасной среды.»</li>\n</ul>\n<p>---</p>", "search": "11. не запускаются программы / антивирус отключён / диспетчер заблокирован - **симптом:** «администратор заблокировал», не открывается реестр/диспетчер.\n- **шаги:** 1) загрузка в безопасном режиме. 2) сканеры из-под hiren's (оффлайн). 3) `sfc /scannow`, `dism ... /restorehealth`. 4) autoruns — снять блокирующее.\n- **клиенту:** «зловред заблокировал систему. вылечу из безопасной среды.»\n\n---\n"}, {"title": "12. Нет интернета / Wi-Fi", "cat": "D. Сеть / интернет", "html": "<ul>\n<li><strong>Симптом:</strong> нет доступа, восклицательный знак на значке сети.</li>\n<li><strong>Шаги:</strong> 1) Другие устройства в этой сети работают? (роутер или ПК). 2) Перезагрузить роутер. 3) Кабель/адаптер, драйвер сетевой (SDIO). 4) Сброс сети.</li>\n<li><strong>Команды:</strong></li>\n</ul>\n<pre>  ipconfig /all\n  ipconfig /flushdns\n  ipconfig /release &amp; ipconfig /renew\n  netsh winsock reset\n  netsh int ip reset</pre>\n<p>  (после reset — перезагрузка)</p>\n<ul>\n<li><strong>Клиенту:</strong> «Гляну, проблема в ПК или в роутере/провайдере — починю своё, по провайдеру подскажу.»</li>\n</ul>", "search": "12. нет интернета / wi-fi - **симптом:** нет доступа, восклицательный знак на значке сети.\n- **шаги:** 1) другие устройства в этой сети работают? (роутер или пк). 2) перезагрузить роутер. 3) кабель/адаптер, драйвер сетевой (sdio). 4) сброс сети.\n- **команды:**\n  ```\n  ipconfig /all\n  ipconfig /flushdns\n  ipconfig /release & ipconfig /renew\n  netsh winsock reset\n  netsh int ip reset\n  ```\n  (после reset — перезагрузка)\n- **клиенту:** «гляну, проблема в пк или в роутере/провайдере — починю своё, по провайдеру подскажу.»\n"}, {"title": "13. Не видит сетевой принтер / общую папку", "cat": "D. Сеть / интернет", "html": "<ul>\n<li><strong>Симптом:</strong> не находит принтер/папку по сети.</li>\n<li><strong>Шаги:</strong> 1) Пинг устройства/IP. 2) Сетевое обнаружение и общий доступ включены, профиль сети «Частная». 3) Служба «Function Discovery». 4) Для старых: SMBv1 (осторожно, лучше по IP <code>\\\\IP\\share</code>). 5) Учётка/пароль для доступа.</li>\n<li><strong>Команды:</strong> <code>ping &lt;ip&gt;</code>; открыть <code>\\\\&lt;ip&gt;</code> в проводнике.</li>\n<li><strong>Клиенту:</strong> «Настрою доступ по сети; где надо — подключу принтер напрямую по адресу.»</li>\n</ul>\n<p>---</p>", "search": "13. не видит сетевой принтер / общую папку - **симптом:** не находит принтер/папку по сети.\n- **шаги:** 1) пинг устройства/ip. 2) сетевое обнаружение и общий доступ включены, профиль сети «частная». 3) служба «function discovery». 4) для старых: smbv1 (осторожно, лучше по ip `\\\\ip\\share`). 5) учётка/пароль для доступа.\n- **команды:** `ping <ip>`; открыть `\\\\<ip>` в проводнике.\n- **клиенту:** «настрою доступ по сети; где надо — подключу принтер напрямую по адресу.»\n\n---\n"}, {"title": "14. Нет звука", "cat": "E. Железо / периферия", "html": "<ul>\n<li><strong>Шаги:</strong> 1) Громкость/устройство вывода (правильное выбрано?). 2) Кабель/разъём (передняя/задняя панель). 3) Драйвер звука (SDIO). 4) Служба Windows Audio. 5) Средство устранения неполадок звука.</li>\n<li><strong>Клиенту:</strong> «Чаще драйвер или выбран не тот выход. Поправлю.»</li>\n</ul>", "search": "14. нет звука - **шаги:** 1) громкость/устройство вывода (правильное выбрано?). 2) кабель/разъём (передняя/задняя панель). 3) драйвер звука (sdio). 4) служба windows audio. 5) средство устранения неполадок звука.\n- **клиенту:** «чаще драйвер или выбран не тот выход. поправлю.»\n"}, {"title": "15. Не определяется USB / флешка / внешний диск", "cat": "E. Железо / периферия", "html": "<ul>\n<li><strong>Шаги:</strong> 1) Другой порт (сзади, USB 2.0), другой ПК. 2) <strong>Управление дисками</strong> — виден ли диск, есть ли буква/раздел (присвоить букву). 3) Драйвер/USB-контроллер. 4) Внешний HDD без своего питания — подключить с доп. питанием. 5) Если щёлкает — см. п.17 (не мучить).</li>\n<li><strong>Команды:</strong> <code>diskmgmt.msc</code> (управление дисками). ⚠ diskpart — осторожно, можно стереть.</li>\n<li><strong>Клиенту:</strong> «Определю, в чём дело: флешка, диск или порт. Если диск умирает, сразу скажу про данные.»</li>\n</ul>", "search": "15. не определяется usb / флешка / внешний диск - **шаги:** 1) другой порт (сзади, usb 2.0), другой пк. 2) **управление дисками** — виден ли диск, есть ли буква/раздел (присвоить букву). 3) драйвер/usb-контроллер. 4) внешний hdd без своего питания — подключить с доп. питанием. 5) если щёлкает — см. п.17 (не мучить).\n- **команды:** `diskmgmt.msc` (управление дисками). ⚠ diskpart — осторожно, можно стереть.\n- **клиенту:** «определю, в чём дело: флешка, диск или порт. если диск умирает, сразу скажу про данные.»\n"}, {"title": "16. Принтер не печатает (локальный)", "cat": "E. Железо / периферия", "html": "<ul>\n<li><strong>Шаги:</strong> 1) Очередь печати (отменить зависшие). 2) Перезапуск службы «Диспетчер печати» (Spooler). 3) Драйвер принтера (с сайта производителя). 4) Кабель/USB-порт, картридж/тонер.</li>\n<li><strong>Команды:</strong> службы → «Диспетчер печати» → перезапуск; очистка очереди: остановить Spooler, очистить <code>C:\\Windows\\System32\\spool\\PRINTERS</code>, запустить.</li>\n<li><strong>Клиенту:</strong> «Перезапущу печать и переустановлю драйвер — обычно лечится.»</li>\n</ul>\n<p>---</p>", "search": "16. принтер не печатает (локальный) - **шаги:** 1) очередь печати (отменить зависшие). 2) перезапуск службы «диспетчер печати» (spooler). 3) драйвер принтера (с сайта производителя). 4) кабель/usb-порт, картридж/тонер.\n- **команды:** службы → «диспетчер печати» → перезапуск; очистка очереди: остановить spooler, очистить `c:\\windows\\system32\\spool\\printers`, запустить.\n- **клиенту:** «перезапущу печать и переустановлю драйвер — обычно лечится.»\n\n---\n"}, {"title": "17. Диск умирает (SMART warning, щелчки, пропадает)", "cat": "F. Диски / данные", "html": "<ul>\n<li><strong>Симптом:</strong> CrystalDiskInfo жёлтый/красный, стук/щелчки, исчезает.</li>\n<li><strong>Шаги:</strong> 1) <strong>СТОП-мучать.</strong> 2) Сразу снять копию важного, пока читается (на ДРУГОЙ диск). 3) Если механический стук/не читается — снять образ <strong>ddrescue</strong> (Linux Live/Hiren&#x27;s) и работать с образом; либо в лабораторию. 4) Диск — под замену (не «лечить»).</li>\n<li><strong>Клиенту:</strong> честно: «Диск умирает. Главное сейчас — спасти данные. Лечить такой диск нельзя, нужна замена.»</li>\n</ul>", "search": "17. диск умирает (smart warning, щелчки, пропадает) - **симптом:** crystaldiskinfo жёлтый/красный, стук/щелчки, исчезает.\n- **шаги:** 1) **стоп-мучать.** 2) сразу снять копию важного, пока читается (на другой диск). 3) если механический стук/не читается — снять образ **ddrescue** (linux live/hiren's) и работать с образом; либо в лабораторию. 4) диск — под замену (не «лечить»).\n- **клиенту:** честно: «диск умирает. главное сейчас — спасти данные. лечить такой диск нельзя, нужна замена.»\n"}, {"title": "18. Восстановление удалённых/потерянных файлов", "cat": "F. Диски / данные", "html": "<ul>\n<li><strong>Симптом:</strong> случайно удалили/отформатировали, файлы пропали.</li>\n<li><strong>Шаги:</strong> 1) <strong>Не записывать ничего на этот диск</strong> (даже не ставить туда программу восстановления). 2) Восстанавливать на ДРУГОЙ носитель. 3) Тулзы: <strong>Recuva</strong> (простое), <strong>PhotoRec/TestDisk</strong> или <strong>DMDE</strong> (глубже). 4) Если диск ещё и сыпется — сначала образ (п.17).</li>\n<li><strong>Клиенту:</strong> «Шансы выше, если на диск больше ничего не писали. Восстановлю на отдельный носитель.»</li>\n</ul>", "search": "18. восстановление удалённых/потерянных файлов - **симптом:** случайно удалили/отформатировали, файлы пропали.\n- **шаги:** 1) **не записывать ничего на этот диск** (даже не ставить туда программу восстановления). 2) восстанавливать на другой носитель. 3) тулзы: **recuva** (простое), **photorec/testdisk** или **dmde** (глубже). 4) если диск ещё и сыпется — сначала образ (п.17).\n- **клиенту:** «шансы выше, если на диск больше ничего не писали. восстановлю на отдельный носитель.»\n"}, {"title": "19. Перенос на SSD (клонирование)", "cat": "F. Диски / данные", "html": "<ul>\n<li><strong>Шаги:</strong> 1) Проверить, что данные влезут в SSD; почистить лишнее. 2) Бэкап важного. 3) Подключить SSD (SATA/USB-адаптер). 4) Клонировать (<strong>Clonezilla</strong> или Macrium-подобное) ИЛИ чистая установка + перенос данных. 5) В BIOS — загрузка с SSD. 6) Включить TRIM, проверить.</li>\n<li><strong>Клиенту:</strong> «Перенесу систему на SSD — станет заметно быстрее. Все данные сохраню.»</li>\n</ul>", "search": "19. перенос на ssd (клонирование) - **шаги:** 1) проверить, что данные влезут в ssd; почистить лишнее. 2) бэкап важного. 3) подключить ssd (sata/usb-адаптер). 4) клонировать (**clonezilla** или macrium-подобное) или чистая установка + перенос данных. 5) в bios — загрузка с ssd. 6) включить trim, проверить.\n- **клиенту:** «перенесу систему на ssd — станет заметно быстрее. все данные сохраню.»\n"}, {"title": "20. Мало места на диске", "cat": "F. Диски / данные", "html": "<ul>\n<li><strong>Шаги:</strong> 1) <strong>WinDirStat</strong> — что занимает место. 2) Очистка диска (cleanmgr) + временные (<code>../скрипты/</code> cleanup). 3) Корзина, загрузки, старые точки восстановления, кэш. 4) Перенести данные/папки на другой диск. 5) <code>WinSxS</code> — только через DISM, не вручную.</li>\n<li><strong>Команды:</strong> <code>cleanmgr</code>; <code>DISM /Online /Cleanup-Image /StartComponentCleanup</code>.</li>\n<li><strong>Клиенту:</strong> «Покажу, что занимает место, и аккуратно почищу лишнее.»</li>\n</ul>\n<p>---</p>", "search": "20. мало места на диске - **шаги:** 1) **windirstat** — что занимает место. 2) очистка диска (cleanmgr) + временные (`../скрипты/` cleanup). 3) корзина, загрузки, старые точки восстановления, кэш. 4) перенести данные/папки на другой диск. 5) `winsxs` — только через dism, не вручную.\n- **команды:** `cleanmgr`; `dism /online /cleanup-image /startcomponentcleanup`.\n- **клиенту:** «покажу, что занимает место, и аккуратно почищу лишнее.»\n\n---\n"}, {"title": "21. Забыл пароль Windows (локальная учётка)", "cat": "G. Доступ / система", "html": "<ul>\n<li><strong>Шаги:</strong> 1) Уточнить, что это <strong>их</strong> компьютер (право на доступ). 2) Локальная учётка — сброс из <strong>Hiren&#x27;s BootCD PE</strong> (утилиты сброса пароля). 3) Аккаунт Microsoft — сброс на account.microsoft.com (не локально). 4) Подсказки/PIN.</li>\n<li><strong>Клиенту:</strong> «Сброшу пароль локальной учётки. Если это аккаунт Microsoft — восстановим через сайт.»</li>\n</ul>", "search": "21. забыл пароль windows (локальная учётка) - **шаги:** 1) уточнить, что это **их** компьютер (право на доступ). 2) локальная учётка — сброс из **hiren's bootcd pe** (утилиты сброса пароля). 3) аккаунт microsoft — сброс на account.microsoft.com (не локально). 4) подсказки/pin.\n- **клиенту:** «сброшу пароль локальной учётки. если это аккаунт microsoft — восстановим через сайт.»\n"}, {"title": "22. Апгрейд (память/SSD) + чистка от пыли", "cat": "G. Доступ / система", "html": "<ul>\n<li><strong>Шаги:</strong> 1) Совместимость (модель платы/слоты — CPU-Z, сайт). 2) Антистатика, обесточить. 3) Установка, чистка от пыли, термопаста. 4) Проверка: память видна (CPU-Z/дашборд), темпы (HWiNFO), стабильность (OCCT). 5) Покажи «до/после».</li>\n<li><strong>Клиенту:</strong> «Подберём по совместимости, поставлю, почищу, покажу прирост.»</li>\n</ul>", "search": "22. апгрейд (память/ssd) + чистка от пыли - **шаги:** 1) совместимость (модель платы/слоты — cpu-z, сайт). 2) антистатика, обесточить. 3) установка, чистка от пыли, термопаста. 4) проверка: память видна (cpu-z/дашборд), темпы (hwinfo), стабильность (occt). 5) покажи «до/после».\n- **клиенту:** «подберём по совместимости, поставлю, почищу, покажу прирост.»\n"}, {"title": "23. Windows не активирована / не ставятся обновления", "cat": "G. Доступ / система", "html": "<ul>\n<li><strong>Шаги:</strong> 1) Активация: честно — только легальный ключ (никаких «активаторов»: риск для клиента и для тебя). 2) Обновления: средство устранения неполадок Windows Update; сброс компонентов (остановить службы wuauserv/bits, очистить <code>SoftwareDistribution</code>, запустить). 3) <code>sfc</code>/<code>DISM</code> если повреждены.</li>\n<li><strong>Клиенту:</strong> «Активацию делаем только легально. Обновления починю.»</li>\n</ul>", "search": "23. windows не активирована / не ставятся обновления - **шаги:** 1) активация: честно — только легальный ключ (никаких «активаторов»: риск для клиента и для тебя). 2) обновления: средство устранения неполадок windows update; сброс компонентов (остановить службы wuauserv/bits, очистить `softwaredistribution`, запустить). 3) `sfc`/`dism` если повреждены.\n- **клиенту:** «активацию делаем только легально. обновления починю.»\n"}, {"title": "24. Тормозит YouTube / Discord / Telegram (включая голос/видео)", "cat": "G. Доступ / система", "html": "<ul>\n<li><strong>Что это:</strong> TSPU-замедление на стороне провайдера (на 2026 — основная массовая жалоба). Картинка тормозит даже на быстром интернете. Голос в Discord рассыпается, видео в Tg грузится через раз, а звонки в Telegram вообще отваливаются. Сам мессенджер (текст) работает обычно нормально.</li>\n<li><strong>Как отличить от «плохой интернет»:</strong> в дашборде <code>🎬 Починить YouTube/Discord/Telegram</code> → проверка покажет: Cloudflare/Google быстрые, замедленный сервис — fail или handshake &gt;1.5 сек. Если ВСЁ медленное — это не сюда, чини сеть/роутер.</li>\n<li><strong>Что чем лечится:</strong></li>\n</ul>\n<table><thead><tr><th>Жалоба</th><th>Лечится</th><th>Чем лучше</th></tr></thead><tbody><tr><td>YouTube тормозит / видео не грузится</td><td>✅ Полностью</td><td>GoodbyeDPI как сервис</td></tr><tr><td>Discord — голос рассыпается / лагает</td><td>✅ Полностью</td><td>GoodbyeDPI / zapret</td></tr><tr><td>Telegram-мессенджер тормозит, файлы качаются медленно</td><td>✅ Полностью</td><td>GoodbyeDPI</td></tr><tr><td>Stories / большие видео в Telegram</td><td>✅ Полностью</td><td>оба</td></tr><tr><td><strong>Голос/видеозвонки в Telegram</strong></td><td>⚠ Частично — это UDP, не TLS</td><td>zapret с <code>general (ALT*).bat</code></td></tr><tr><td>Голосовые сообщения в WhatsApp</td><td>⚠ Не лечится (Meta + UDP)</td><td>только VPN</td></tr></tbody></table>\n<ul>\n<li><strong>Решение (по приоритету):</strong></li>\n<li><strong>GoodbyeDPI</strong> (<code>portable/youtube-fix/goodbyedpi/</code>) — годами проверенный TLS-fragmentation, ставится как Windows-сервис. Запуск: кнопка «🎬 Починить» в дашборде → «GoodbyeDPI» → «Поставить сервис». Заработает за 3-5 сек, переживёт перезагрузку. Лечит 90% случаев с YouTube/Discord/Telegram-мессенджером.</li>\n<li><strong>zapret</strong> (<code>portable/youtube-fix/zapret/</code>) — если GoodbyeDPI не пробил (свежие TSPU-апдейты) ИЛИ нужны Telegram-звонки. У zapret 19 готовых стратегий (<code>general (ALT1..11).bat</code>, FAKE TLS варианты) — мастер пробует по одной пока не сработает. UDP-стратегии в <code>general (ALT*).bat</code> лечат голос в Telegram частично.</li>\n<li><strong>Если оба не помогают</strong> — провайдер настроил TSPU жёстко (бывает на МТС и Билайне в крупных городах). Голос в Telegram, видеозвонки, WhatsApp-голосовые — нужен VPN-уровень. См. ниже «Что предложить если локальное не справилось».</li>\n<li><strong>Что предложить если локальное не справилось (порядок убывания «нашей» ответственности):</strong></li>\n<li><strong>Open-source DIY</strong> (AmneziaVPN / Outline + свой VPS) — мастер может предложить услугу разовой настройки (1500-3000р): арендуем клиенту VPS у Selectel/Vultr (~150-300р/мес платит клиент напрямую провайдеру), ставим клиент-сервер. Формально это настройка ПО клиенту, а не продажа услуги связи — с юридической стороны это чисто.</li>\n<li><strong>Готовый подписочный сервис с ref-ссылкой</strong> — кнопка «🔗 VPN-варианты» в дашборде → клиент сам выбирает, мастер получает реф-доход. <strong>ВАЖНО:</strong> не рекламировать сервисы заблокированные Роскомнадзором (NordVPN/Express/Surfshark/Proton — статья). Безопаснее — российские или open-source. Реф-коды мастер заполняет в <code>vpn-recommendations.json</code>.</li>\n<li><strong>Честный отказ</strong> — «локально я сделал что мог. Дальше — VPN, я этим не торгую. Гугли „AmneziaVPN“ или платный сервис, выбор за тобой.» Это худший экономически, но всегда юридически чистый вариант.</li>\n<li><strong>Откат:</strong> кнопка «🎬 Починить» → «Снять сервис». Гарантированно отключает обход без следов в системе.</li>\n<li><strong>Клиенту:</strong> «Замедляет провайдер на стороне сети, не твой ПК. Поставлю open-source утилиту от российского разработчика — она это лечит локально, без VPN и без подписок. Хочешь снять — снимется в один клик. Звонки в Telegram могут не до конца восстановиться, потому что это UDP, а его сложнее починить локально. Если они тебе важны — есть VPN-варианты, вот рекомендации, выбор за тобой.»</li>\n<li><strong>Скрипт разговора про VPN (важно):</strong> «Я тебе рекомендую как один из инструментов, не гарантирую качество и стабильность стороннего сервиса. Подписка может перестать работать в любой момент — это РФ, реальность такая. Локальное решение, которое я поставил, надёжнее, но звонки в Tg оно не вытащит полностью.»</li>\n<li><strong>Откат:</strong> кнопка «🎬 Починить» → «Снять сервис». Гарантированно отключает обход без следов в системе.</li>\n<li><strong>Клиенту:</strong> «Замедляет провайдер на стороне сети, не твой ПК. Поставлю open-source утилиту от российского разработчика — она это лечит локально, без VPN и без подписок. Хочешь снять — снимется в один клик. Только звонки в Telegram могут не до конца восстановиться, это уже не текст — там UDP, его сложнее починить локально.»</li>\n<li><strong>Что НЕ говорить:</strong> «обход блокировок», «VPN», «прокси». Утилита не открывает заблокированные сайты — она восстанавливает скорость к тем, которые провайдер замедлил. Об этом и говори: <strong>чиним торможение</strong>.</li>\n<li><strong>Не браться:</strong> если клиент работает на корпоративном ПК / VPN компании, на ПК с антивирусом с DPI-фильтром (Касперский Endpoint, ESET с SSL-инспекцией) — GoodbyeDPI/zapret конфликтуют с этими сценариями.</li>\n</ul>", "search": "24. тормозит youtube / discord / telegram (включая голос/видео) - **что это:** tspu-замедление на стороне провайдера (на 2026 — основная массовая жалоба). картинка тормозит даже на быстром интернете. голос в discord рассыпается, видео в tg грузится через раз, а звонки в telegram вообще отваливаются. сам мессенджер (текст) работает обычно нормально.\n- **как отличить от «плохой интернет»:** в дашборде `🎬 починить youtube/discord/telegram` → проверка покажет: cloudflare/google быстрые, замедленный сервис — fail или handshake >1.5 сек. если всё медленное — это не сюда, чини сеть/роутер.\n- **что чем лечится:**\n  | жалоба | лечится | чем лучше |\n  |---|---|---|\n  | youtube тормозит / видео не грузится | ✅ полностью | goodbyedpi как сервис |\n  | discord — голос рассыпается / лагает | ✅ полностью | goodbyedpi / zapret |\n  | telegram-мессенджер тормозит, файлы качаются медленно | ✅ полностью | goodbyedpi |\n  | stories / большие видео в telegram | ✅ полностью | оба |\n  | **голос/видеозвонки в telegram** | ⚠ частично — это udp, не tls | zapret с `general (alt*).bat` |\n  | голосовые сообщения в whatsapp | ⚠ не лечится (meta + udp) | только vpn |\n- **решение (по приоритету):**\n  1. **goodbyedpi** (`portable/youtube-fix/goodbyedpi/`) — годами проверенный tls-fragmentation, ставится как windows-сервис. запуск: кнопка «🎬 починить» в дашборде → «goodbyedpi» → «поставить сервис». заработает за 3-5 сек, переживёт перезагрузку. лечит 90% случаев с youtube/discord/telegram-мессенджером.\n  2. **zapret** (`portable/youtube-fix/zapret/`) — если goodbyedpi не пробил (свежие tspu-апдейты) или нужны telegram-звонки. у zapret 19 готовых стратегий (`general (alt1..11).bat`, fake tls варианты) — мастер пробует по одной пока не сработает. udp-стратегии в `general (alt*).bat` лечат голос в telegram частично.\n  3. **если оба не помогают** — провайдер настроил tspu жёстко (бывает на мтс и билайне в крупных городах). голос в telegram, видеозвонки, whatsapp-голосовые — нужен vpn-уровень. см. ниже «что предложить если локальное не справилось».\n- **что предложить если локальное не справилось (порядок убывания «нашей» ответственности):**\n  1. **open-source diy** (amneziavpn / outline + свой vps) — мастер может предложить услугу разовой настройки (1500-3000р): арендуем клиенту vps у selectel/vultr (~150-300р/мес платит клиент напрямую провайдеру), ставим клиент-сервер. формально это настройка по клиенту, а не продажа услуги связи — с юридической стороны это чисто.\n  2. **готовый подписочный сервис с ref-ссылкой** — кнопка «🔗 vpn-варианты» в дашборде → клиент сам выбирает, мастер получает реф-доход. **важно:** не рекламировать сервисы заблокированные роскомнадзором (nordvpn/express/surfshark/proton — статья). безопаснее — российские или open-source. реф-коды мастер заполняет в `vpn-recommendations.json`.\n  3. **честный отказ** — «локально я сделал что мог. дальше — vpn, я этим не торгую. гугли „amneziavpn“ или платный сервис, выбор за тобой.» это худший экономически, но всегда юридически чистый вариант.\n- **откат:** кнопка «🎬 починить» → «снять сервис». гарантированно отключает обход без следов в системе.\n- **клиенту:** «замедляет провайдер на стороне сети, не твой пк. поставлю open-source утилиту от российского разработчика — она это лечит локально, без vpn и без подписок. хочешь снять — снимется в один клик. звонки в telegram могут не до конца восстановиться, потому что это udp, а его сложнее починить локально. если они тебе важны — есть vpn-варианты, вот рекомендации, выбор за тобой.»\n- **скрипт разговора про vpn (важно):** «я тебе рекомендую как один из инструментов, не гарантирую качество и стабильность стороннего сервиса. подписка может перестать работать в любой момент — это рф, реальность такая. локальное решение, которое я поставил, надёжнее, но звонки в tg оно не вытащит полностью.»\n- **откат:** кнопка «🎬 починить» → «снять сервис». гарантированно отключает обход без следов в системе.\n- **клиенту:** «замедляет провайдер на стороне сети, не твой пк. поставлю open-source утилиту от российского разработчика — она это лечит локально, без vpn и без подписок. хочешь снять — снимется в один клик. только звонки в telegram могут не до конца восстановиться, это уже не текст — там udp, его сложнее починить локально.»\n- **что не говорить:** «обход блокировок», «vpn», «прокси». утилита не открывает заблокированные сайты — она восстанавливает скорость к тем, которые провайдер замедлил. об этом и говори: **чиним торможение**.\n- **не браться:** если клиент работает на корпоративном пк / vpn компании, на пк с антивирусом с dpi-фильтром (касперский endpoint, eset с ssl-инспекцией) — goodbyedpi/zapret конфликтуют с этими сценариями.\n"}, {"title": "25. Полный бэкап клиента — где забывают искать важные файлы", "cat": "G. Доступ / система", "html": "<p>Это <strong>ПРАВИЛО №1 мастера</strong>. Перед любой серьёзной работой (переустановка Windows, замена/клонирование диска, лечение шифровальщика, исправление BSOD, замена железа) — спаси данные. Программа-бэкапер видит только типичные папки, реальные важные файлы могут быть где угодно.</p>\n<p><strong>ОБЯЗАТЕЛЬНО расспроси клиента — назвать ВСЕ важные файлы.</strong> Скрипт см. <code>регламенты-и-общение.docx</code> → «Перед любой серьёзной работой».</p>\n<p><strong>10 типичных мест где забывают:</strong></p>\n<table><thead><tr><th>#</th><th>Место</th><th>Что внутри</th></tr></thead><tbody><tr><td>1</td><td><code>C:\\Users\\&lt;u&gt;\\Desktop</code> + <code>Documents</code> + <code>Downloads</code> + <code>Pictures</code> + <code>Music</code> + <code>Videos</code></td><td>Стандартные профильные папки — автоматически</td></tr><tr><td>2</td><td><code>C:\\Users\\&lt;u&gt;\\AppData\\Roaming\\Telegram Desktop\\</code></td><td>Локальная история чатов + загрузки Telegram ⚠ <strong>активные сессии и ключи</strong> — требует отдельного согласия</td></tr><tr><td>3</td><td><code>C:\\Users\\&lt;u&gt;\\AppData\\Local\\Microsoft\\Outlook\\</code></td><td>PST/OST — локальные ящики почты</td></tr><tr><td>4</td><td><code>C:\\Users\\&lt;u&gt;\\AppData\\Roaming\\Thunderbird\\</code></td><td>Почта и адресная книга Thunderbird</td></tr><tr><td>5</td><td><code>C:\\Users\\&lt;u&gt;\\AppData\\Roaming\\Mozilla\\Firefox\\Profiles\\</code></td><td>Закладки, история, расширения Firefox</td></tr><tr><td>6</td><td><code>C:\\Users\\&lt;u&gt;\\AppData\\Roaming\\1C\\1Cv8\\</code></td><td>Файловые базы 1С</td></tr><tr><td>7</td><td><code>C:\\Users\\&lt;u&gt;\\AppData\\Roaming\\&lt;игра&gt;</code> / <code>Documents\\My Games\\</code> / <code>AppData\\LocalLow\\</code></td><td><strong>Игровые сейвы</strong> — Скайрим, Сталкер, Unity-игры</td></tr><tr><td>8</td><td><code>C:\\Users\\&lt;u&gt;\\AppData\\Roaming\\KeePass\\</code></td><td>Хранилище паролей ⚠ <strong>секрет доступа</strong> — копировать только в зашифрованный контейнер по отдельному согласию</td></tr><tr><td>9</td><td><code>D:\\</code>, <code>E:\\</code> корни — папки <code>Работа</code>, <code>Семейный архив</code>, <code>Бухгалтерия</code></td><td>Что клиент создал сам — мастер не знает имена</td></tr><tr><td>10</td><td><code>C:\\Users\\&lt;u&gt;\\OneDrive\\</code> / <code>\\YandexDisk\\</code> / <code>\\Dropbox\\</code></td><td>Локально синхронизированные облачные папки</td></tr></tbody></table>\n<p><strong>Дашборд Verus делает половину работы автоматически:</strong></p>\n<ul>\n<li>Кнопка «💾 Бэкап данных» → сканирует AppData / облака / другие диски</li>\n<li>Показывает что нашёл + плашку «<strong>Спроси клиента</strong>»</li>\n<li>Поле «Дополнительные папки от клиента» — мастер вписывает руками со слов клиента, программа всё копирует в <code>Backup_&lt;user&gt;_&lt;дата&gt;/Extra/</code></li>\n<li>В корне бэкапа создаётся <code>BACKUP-MANIFEST.txt</code> — что скопировалось, что нет</li>\n</ul>\n<p><strong>Чек-лист расспроса</strong> (озвучь клиенту по пунктам, не пропускай):</p>\n<ul>\n<li>✅ «Игры со сейвами — в какие играешь долгое? Скайрим, Сталкер, RPG?»</li>\n<li>✅ «Почта Outlook или Thunderbird? База локально?»</li>\n<li>✅ «Базы 1С, бухгалтерия, рабочие программы со своими файлами?»</li>\n<li>✅ «Второй диск D:\\ или E:\\ — что там важного?»</li>\n<li>✅ «Облака — Яндекс.Диск, OneDrive, Dropbox локально установлены?»</li>\n<li>✅ «Закладки браузера / пароли — без облака?»</li>\n<li>✅ «Прошлый компьютер — может важное только там?»</li>\n</ul>\n<p><strong>Стоимость ошибки высокая:</strong> забыл спросить, потерял единственный фотоархив клиента — и репутация в районе мертва. Расспрос занимает 10 минут, а фотографии клиента копились годами — экономить тут не на чем.</p>\n<p><strong>⚠ Разделение «обычных данных» и «секретов доступа»:</strong></p>\n<ul>\n<li>Документы/фото/видео — обычные пользовательские данные. Бэкапятся в стандартный архив с согласия клиента</li>\n<li><strong>Telegram-сессии, профили браузеров с авторизациями, базы менеджеров паролей (KeePass), почтовые PST</strong> — это <strong>секреты доступа</strong>. Копируются только с <strong>отдельным письменным согласием в акте</strong>, в <strong>зашифрованный контейнер</strong> (7-Zip с паролем минимум, лучше VeraCrypt), мастер <strong>не открывает</strong> содержимое. После работы — либо вернуть на устройство клиента, либо удалить полностью</li>\n</ul>\n<p>В акте приёмки полезно отдельной строкой: «Копирование сессий мессенджеров, профилей браузеров и баз паролей: ☐ Согласен / ☐ Не согласен. Подпись клиента: ____».</p>", "search": "25. полный бэкап клиента — где забывают искать важные файлы \nэто **правило №1 мастера**. перед любой серьёзной работой (переустановка windows, замена/клонирование диска, лечение шифровальщика, исправление bsod, замена железа) — спаси данные. программа-бэкапер видит только типичные папки, реальные важные файлы могут быть где угодно.\n\n**обязательно расспроси клиента — назвать все важные файлы.** скрипт см. `регламенты-и-общение.docx` → «перед любой серьёзной работой».\n\n**10 типичных мест где забывают:**\n\n| # | место | что внутри |\n|---|---|---|\n| 1 | `c:\\users\\<u>\\desktop` + `documents` + `downloads` + `pictures` + `music` + `videos` | стандартные профильные папки — автоматически |\n| 2 | `c:\\users\\<u>\\appdata\\roaming\\telegram desktop\\` | локальная история чатов + загрузки telegram ⚠ **активные сессии и ключи** — требует отдельного согласия |\n| 3 | `c:\\users\\<u>\\appdata\\local\\microsoft\\outlook\\` | pst/ost — локальные ящики почты |\n| 4 | `c:\\users\\<u>\\appdata\\roaming\\thunderbird\\` | почта и адресная книга thunderbird |\n| 5 | `c:\\users\\<u>\\appdata\\roaming\\mozilla\\firefox\\profiles\\` | закладки, история, расширения firefox |\n| 6 | `c:\\users\\<u>\\appdata\\roaming\\1c\\1cv8\\` | файловые базы 1с |\n| 7 | `c:\\users\\<u>\\appdata\\roaming\\<игра>` / `documents\\my games\\` / `appdata\\locallow\\` | **игровые сейвы** — скайрим, сталкер, unity-игры |\n| 8 | `c:\\users\\<u>\\appdata\\roaming\\keepass\\` | хранилище паролей ⚠ **секрет доступа** — копировать только в зашифрованный контейнер по отдельному согласию |\n| 9 | `d:\\`, `e:\\` корни — папки `работа`, `семейный архив`, `бухгалтерия` | что клиент создал сам — мастер не знает имена |\n| 10 | `c:\\users\\<u>\\onedrive\\` / `\\yandexdisk\\` / `\\dropbox\\` | локально синхронизированные облачные папки |\n\n**дашборд verus делает половину работы автоматически:**\n- кнопка «💾 бэкап данных» → сканирует appdata / облака / другие диски\n- показывает что нашёл + плашку «**спроси клиента**»\n- поле «дополнительные папки от клиента» — мастер вписывает руками со слов клиента, программа всё копирует в `backup_<user>_<дата>/extra/`\n- в корне бэкапа создаётся `backup-manifest.txt` — что скопировалось, что нет\n\n**чек-лист расспроса** (озвучь клиенту по пунктам, не пропускай):\n1. ✅ «игры со сейвами — в какие играешь долгое? скайрим, сталкер, rpg?»\n2. ✅ «почта outlook или thunderbird? база локально?»\n3. ✅ «базы 1с, бухгалтерия, рабочие программы со своими файлами?»\n4. ✅ «второй диск d:\\ или e:\\ — что там важного?»\n5. ✅ «облака — яндекс.диск, onedrive, dropbox локально установлены?»\n6. ✅ «закладки браузера / пароли — без облака?»\n7. ✅ «прошлый компьютер — может важное только там?»\n\n**стоимость ошибки высокая:** забыл спросить, потерял единственный фотоархив клиента — и репутация в районе мертва. расспрос занимает 10 минут, а фотографии клиента копились годами — экономить тут не на чем.\n\n**⚠ разделение «обычных данных» и «секретов доступа»:**\n- документы/фото/видео — обычные пользовательские данные. бэкапятся в стандартный архив с согласия клиента\n- **telegram-сессии, профили браузеров с авторизациями, базы менеджеров паролей (keepass), почтовые pst** — это **секреты доступа**. копируются только с **отдельным письменным согласием в акте**, в **зашифрованный контейнер** (7-zip с паролем минимум, лучше veracrypt), мастер **не открывает** содержимое. после работы — либо вернуть на устройство клиента, либо удалить полностью\n\nв акте приёмки полезно отдельной строкой: «копирование сессий мессенджеров, профилей браузеров и баз паролей: ☐ согласен / ☐ не согласен. подпись клиента: ____».\n"}, {"title": "26. Ноутбук — типичные жалобы и специфика", "cat": "G. Доступ / система", "html": "<p>70% домашнего рынка — ноутбуки. У них своя анатомия и свои отказы.</p>\n<ul>\n<li><strong>Шарниры (петли крышки) треснули</strong> — типично у HP (Pavilion), Acer Aspire, дешёвых Lenovo. Симптом: крышка ходит туго или болтается, корпус расходится у петель. <strong>Не разбирай на месте</strong> — пластик дешёвый, ломается при первом неаккуратном движении. В лабораторию или сразу честный отказ «нужна замена корпуса». Цена ремонта ~3-5 тыс плюс запчасть.</li>\n<li><strong>Матрица — битый пиксель vs трещина</strong> — битый пиксель (точка не работает) лечится только заменой. Чёрные пятна по краям = расслоение поляризатора (тоже замена). Трещина = удар → замена матрицы. Заказ только по part-number с шильдика самой матрицы (<code>Innolux N140HCA-EAC</code> и т.п.) — не по модели ноута, в одной модели бывает 3-4 типа матриц.</li>\n<li><strong>Клавиатура залита/западает</strong> — попроси клиента описать что пили: вода/чай/кола. Сахарные напитки = надо разбирать и чистить, иначе через неделю всё слипнется. Замена клавиатуры на ноутбуке = 1500-3500₽ + работа.</li>\n<li><strong>Не заряжается / не работает зарядка</strong> — проверь по порядку: 1) другой блок питания, 2) разъём (часто отламывается на материнке — тогда пайка), 3) аккумулятор (см. кейс «Литий-полимер» в курсе безопасности). Не лезь паять разъём без опыта — поможет специалист.</li>\n<li><strong>Перегрев</strong> — у ноутбуков критичнее чем у десктопов из-за плотности компоновки. Чистка от пыли + замена термопасты раз в 2 года — стандартная процедура (1500-2500₽). MX-4 термопаста, не PC-1.</li>\n<li><strong>Не браться:</strong> <strong>Apple MacBook любой год</strong>, ультрабуки с BGA-чипами (Surface, XPS), любая пайка без опыта. Скажи: «Это для специализированного сервиса с термостолом, я работаю с обычными ноутбуками и десктопами».</li>\n</ul>", "search": "26. ноутбук — типичные жалобы и специфика \n70% домашнего рынка — ноутбуки. у них своя анатомия и свои отказы.\n\n- **шарниры (петли крышки) треснули** — типично у hp (pavilion), acer aspire, дешёвых lenovo. симптом: крышка ходит туго или болтается, корпус расходится у петель. **не разбирай на месте** — пластик дешёвый, ломается при первом неаккуратном движении. в лабораторию или сразу честный отказ «нужна замена корпуса». цена ремонта ~3-5 тыс плюс запчасть.\n- **матрица — битый пиксель vs трещина** — битый пиксель (точка не работает) лечится только заменой. чёрные пятна по краям = расслоение поляризатора (тоже замена). трещина = удар → замена матрицы. заказ только по part-number с шильдика самой матрицы (`innolux n140hca-eac` и т.п.) — не по модели ноута, в одной модели бывает 3-4 типа матриц.\n- **клавиатура залита/западает** — попроси клиента описать что пили: вода/чай/кола. сахарные напитки = надо разбирать и чистить, иначе через неделю всё слипнется. замена клавиатуры на ноутбуке = 1500-3500₽ + работа.\n- **не заряжается / не работает зарядка** — проверь по порядку: 1) другой блок питания, 2) разъём (часто отламывается на материнке — тогда пайка), 3) аккумулятор (см. кейс «литий-полимер» в курсе безопасности). не лезь паять разъём без опыта — поможет специалист.\n- **перегрев** — у ноутбуков критичнее чем у десктопов из-за плотности компоновки. чистка от пыли + замена термопасты раз в 2 года — стандартная процедура (1500-2500₽). mx-4 термопаста, не pc-1.\n- **не браться:** **apple macbook любой год**, ультрабуки с bga-чипами (surface, xps), любая пайка без опыта. скажи: «это для специализированного сервиса с термостолом, я работаю с обычными ноутбуками и десктопами».\n"}, {"title": "27. Сборка ПК с нуля — частый заказ", "cat": "G. Доступ / система", "html": "<p>Клиент: «помоги собрать игровой ПК за 80к».</p>\n<p><strong>Алгоритм:</strong></p>\n<ul>\n<li><strong>Бюджет и цель</strong> — игры (что играет в 2026?), работа (рендер, монтаж?), офис. Под цель — конфиг</li>\n<li><strong>Конфигуратор</strong> — <code>dns-shop.ru</code> / <code>citilink.ru</code> / <code>regard.ru</code> имеют web-конфигураторы с проверкой совместимости. Подскажи клиенту что брать</li>\n<li><strong>Расчёт БП</strong> — суммируй TDP всех компонентов + 30% запас. Игровая видеокарта 200W + CPU 150W + остальное 100W = 450W нужно → берём 600W с сертификатом 80+ Bronze минимум</li>\n<li><strong>Балансировка узких мест</strong> — не ставь RTX 4070 к старому Ryzen 5 2600 — карта будет ждать процессор. Соотношение цены процессор:видеокарта обычно 1:1.5-2 в игровом ПК</li>\n<li><strong>Сборка</strong> — антистат-браслет (см. курс безопасности), порядок: материнка на коврик → CPU + кулер → RAM → M.2 SSD → в корпус → БП → видеокарта → подключения → тестовый запуск <strong>до закрытия крышки</strong></li>\n<li><strong>Обкатка</strong> — MemTest86 (4 прохода), AIDA64 Stress Test (1 час всех компонентов), несколько часов любой нагруженной игры</li>\n<li><strong>Установка Windows + драйверы</strong> + минимальный софт по запросу клиента</li>\n</ul>\n<p><strong>Цена услуги:</strong> 3-5 тыс за сборку «под ключ» (с установкой Windows и драйверами).</p>\n<p><strong>Главное правило:</strong> комплектующие клиент покупает САМ по твоему списку (DNS/Citilink с самовывозом). Не неси через себя — если что сломается, гарантия будет от магазина, не от тебя.</p>", "search": "27. сборка пк с нуля — частый заказ \nклиент: «помоги собрать игровой пк за 80к».\n\n**алгоритм:**\n1. **бюджет и цель** — игры (что играет в 2026?), работа (рендер, монтаж?), офис. под цель — конфиг\n2. **конфигуратор** — `dns-shop.ru` / `citilink.ru` / `regard.ru` имеют web-конфигураторы с проверкой совместимости. подскажи клиенту что брать\n3. **расчёт бп** — суммируй tdp всех компонентов + 30% запас. игровая видеокарта 200w + cpu 150w + остальное 100w = 450w нужно → берём 600w с сертификатом 80+ bronze минимум\n4. **балансировка узких мест** — не ставь rtx 4070 к старому ryzen 5 2600 — карта будет ждать процессор. соотношение цены процессор:видеокарта обычно 1:1.5-2 в игровом пк\n5. **сборка** — антистат-браслет (см. курс безопасности), порядок: материнка на коврик → cpu + кулер → ram → m.2 ssd → в корпус → бп → видеокарта → подключения → тестовый запуск **до закрытия крышки**\n6. **обкатка** — memtest86 (4 прохода), aida64 stress test (1 час всех компонентов), несколько часов любой нагруженной игры\n7. **установка windows + драйверы** + минимальный софт по запросу клиента\n\n**цена услуги:** 3-5 тыс за сборку «под ключ» (с установкой windows и драйверами).\n\n**главное правило:** комплектующие клиент покупает сам по твоему списку (dns/citilink с самовывозом). не неси через себя — если что сломается, гарантия будет от магазина, не от тебя.\n"}, {"title": "28. Апгрейд — что стоит, что нет", "cat": "G. Доступ / система", "html": "<p>Самый частый вопрос новичков: «у меня старый ПК, может проапгрейдить?». Реалистичная карта решений:</p>\n<table><thead><tr><th>Хочу</th><th>Стоит ли?</th><th>Что предложить</th></tr></thead><tbody><tr><td><strong>Добавить SSD к HDD</strong></td><td>✅ <strong>Всегда стоит.</strong> Самое дешёвое и самое заметное ускорение. ОС переезжает на SSD</td><td>M.2 NVMe 500ГБ от 2500₽ + клонирование (Macrium Reflect)</td></tr><tr><td><strong>Увеличить RAM с 8→16/32ГБ</strong></td><td>✅ <strong>Если многозадачность.</strong> Игры с 8 ГБ страдают</td><td>Проверь slot&#x27;ы (<code>wmic memorychip</code> или CPU-Z), купи модули того же стандарта (DDR4/DDR5) и частоты</td></tr><tr><td><strong>Заменить старую видеокарту на новую</strong></td><td>⚠ <strong>С оговорками.</strong> GTX 750 → RTX 3060 в старый Intel Core i3 — упрётся в CPU. Плюс старый БП может не вытянуть</td><td>Сначала проверь TDP видеокарты vs мощность БП. Замени БП если запаса нет</td></tr><tr><td><strong>DDR3 → DDR4</strong></td><td>❌ <strong>Нет.</strong> Это новая материнка + новый процессор + новая память. Дешевле собрать новый ПК</td><td>Скажи клиенту: «Это уже новый компьютер, дешевле собрать с нуля»</td></tr><tr><td><strong>Купить ПК на Авито</strong></td><td>⚠ <strong>Только с диагностикой.</strong> Часто продают «после потопа» / с битой видеокартой / с умирающим SSD</td><td>Предложи услугу «осмотр перед покупкой» — 1000-1500₽ за выезд к продавцу</td></tr><tr><td><strong>Жидкостное охлаждение в старый ПК</strong></td><td>❌ <strong>Понты, не нужно.</strong> Воздушный кулер DeepCool/Noctua за 2000₽ справится с 90% задач</td><td></td></tr></tbody></table>\n<p><strong>Скрипт разговора:</strong> «Расскажи что не устраивает в текущем ПК. Если только тормоза при загрузке Windows и в офисе — SSD за 2500₽ всё решит. Если игры — давай конкретику какие, проверим что упирается».</p>", "search": "28. апгрейд — что стоит, что нет \nсамый частый вопрос новичков: «у меня старый пк, может проапгрейдить?». реалистичная карта решений:\n\n| хочу | стоит ли? | что предложить |\n|---|---|---|\n| **добавить ssd к hdd** | ✅ **всегда стоит.** самое дешёвое и самое заметное ускорение. ос переезжает на ssd | m.2 nvme 500гб от 2500₽ + клонирование (macrium reflect) |\n| **увеличить ram с 8→16/32гб** | ✅ **если многозадачность.** игры с 8 гб страдают | проверь slot'ы (`wmic memorychip` или cpu-z), купи модули того же стандарта (ddr4/ddr5) и частоты |\n| **заменить старую видеокарту на новую** | ⚠ **с оговорками.** gtx 750 → rtx 3060 в старый intel core i3 — упрётся в cpu. плюс старый бп может не вытянуть | сначала проверь tdp видеокарты vs мощность бп. замени бп если запаса нет |\n| **ddr3 → ddr4** | ❌ **нет.** это новая материнка + новый процессор + новая память. дешевле собрать новый пк | скажи клиенту: «это уже новый компьютер, дешевле собрать с нуля» |\n| **купить пк на авито** | ⚠ **только с диагностикой.** часто продают «после потопа» / с битой видеокартой / с умирающим ssd | предложи услугу «осмотр перед покупкой» — 1000-1500₽ за выезд к продавцу |\n| **жидкостное охлаждение в старый пк** | ❌ **понты, не нужно.** воздушный кулер deepcool/noctua за 2000₽ справится с 90% задач |  |\n\n**скрипт разговора:** «расскажи что не устраивает в текущем пк. если только тормоза при загрузке windows и в офисе — ssd за 2500₽ всё решит. если игры — давай конкретику какие, проверим что упирается».\n"}, {"title": "29. Подержанная техника — как смотреть", "cat": "G. Доступ / система", "html": "<p>Клиент просит «помоги выбрать б/у ноут на Авито». Услуга: 1000-1500₽ за выезд к продавцу + проверка.</p>\n<p><strong>Что проверить:</strong></p>\n<ul>\n<li><strong>Внешне:</strong> царапины, потёртости клавиш (понятно сколько пользовались), вмятины (был ли удар)</li>\n<li><strong>Жесткий диск/SSD:</strong> CrystalDiskInfo с твоей флешки. Часы работы, ошибки, статус Healthy/Caution</li>\n<li><strong>RAM:</strong> MemTest86 минимум 1 проход (15-30 минут). Любые errors = ОЗУ битая</li>\n<li><strong>Аккумулятор ноута:</strong> <code>powercfg /batteryreport</code> → отчёт по износу. &gt;30% износа = плохая батарея, нужна замена (3-5 тыс)</li>\n<li><strong>Экран:</strong> залей чисто белый/чёрный/красный/зелёный фон через <code>dead-pixels-test.com</code> — посмотри битые пиксели</li>\n<li><strong>Клавиатура:</strong> все клавиши через <code>keyboardtester.com</code></li>\n<li><strong>Порты:</strong> воткни флешку в каждый USB, проверь HDMI на TV/мониторе</li>\n<li><strong>Тест нагрузкой:</strong> AIDA64 Stress Test 30 минут — если глючит, выключается, перегревается = брак</li>\n</ul>\n<p><strong>Что говорить клиенту:</strong></p>\n<blockquote>«Если что-то из этого не пройдёт — отказывайся, ищи другого продавца. Это типичные скрытые дефекты. Лучше потратить день на поиск нормального ноута, чем сразу нести в ремонт».</blockquote>", "search": "29. подержанная техника — как смотреть \nклиент просит «помоги выбрать б/у ноут на авито». услуга: 1000-1500₽ за выезд к продавцу + проверка.\n\n**что проверить:**\n\n1. **внешне:** царапины, потёртости клавиш (понятно сколько пользовались), вмятины (был ли удар)\n2. **жесткий диск/ssd:** crystaldiskinfo с твоей флешки. часы работы, ошибки, статус healthy/caution\n3. **ram:** memtest86 минимум 1 проход (15-30 минут). любые errors = озу битая\n4. **аккумулятор ноута:** `powercfg /batteryreport` → отчёт по износу. >30% износа = плохая батарея, нужна замена (3-5 тыс)\n5. **экран:** залей чисто белый/чёрный/красный/зелёный фон через `dead-pixels-test.com` — посмотри битые пиксели\n6. **клавиатура:** все клавиши через `keyboardtester.com`\n7. **порты:** воткни флешку в каждый usb, проверь hdmi на tv/мониторе\n8. **тест нагрузкой:** aida64 stress test 30 минут — если глючит, выключается, перегревается = брак\n\n**что говорить клиенту:**\n> «если что-то из этого не пройдёт — отказывайся, ищи другого продавца. это типичные скрытые дефекты. лучше потратить день на поиск нормального ноута, чем сразу нести в ремонт».\n"}, {"title": "30. Принтеры — отказ + где помочь", "cat": "G. Доступ / система", "html": "<p>Принтеры — частая просьба. <strong>Базовая позиция: не лезь в принтерное хозяйство.</strong> Там своя специфика, чернила и тонеры токсичны, а заправка картриджей приносит копейки.</p>\n<p><strong>Что можешь:</strong></p>\n<ul>\n<li>Переустановить драйвер принтера в Windows (типовая задача — 500₽)</li>\n<li>Настроить сетевую печать (Wi-Fi принтер — 1000₽)</li>\n<li>Сбросить памперс Epson через <code>WIC Reset Utility</code> (1000₽) — <strong>только</strong> после физической замены или очистки узла отработанных чернил (waste ink pad / maintenance box). Сброс счётчика без обслуживания памперса = перелив чернил → испорченная мебель/пол клиента + повреждение принтера. Если памперс заменить нечем — честный отказ, направление в принтерный сервис</li>\n<li>Объяснить клиенту что «принтер пишет «закончился картридж» хотя ещё есть» = чип-обнуление</li>\n</ul>\n<p><strong>Что НЕ делай:</strong></p>\n<ul>\n<li>Заправка картриджей (грязная работа, низкая цена, риск пролить тонер на свой ноут)</li>\n<li>Разборка лазерных принтеров (барабан хрупкий, легко сломать)</li>\n<li>Замена термопары / фьюзера (специфическая работа)</li>\n</ul>\n<p><strong>Скрипт отказа:</strong></p>\n<blockquote>«По принтерам я только настройку драйверов и сети делаю. Заправку/ремонт — направлю в специализированный сервис. Контакты могу дать.»</blockquote>\n<p>Найди 1-2 проверенных принтерных сервиса в своём районе и держи контакты — это твой реферальный поток.</p>", "search": "30. принтеры — отказ + где помочь \nпринтеры — частая просьба. **базовая позиция: не лезь в принтерное хозяйство.** там своя специфика, чернила и тонеры токсичны, а заправка картриджей приносит копейки.\n\n**что можешь:**\n- переустановить драйвер принтера в windows (типовая задача — 500₽)\n- настроить сетевую печать (wi-fi принтер — 1000₽)\n- сбросить памперс epson через `wic reset utility` (1000₽) — **только** после физической замены или очистки узла отработанных чернил (waste ink pad / maintenance box). сброс счётчика без обслуживания памперса = перелив чернил → испорченная мебель/пол клиента + повреждение принтера. если памперс заменить нечем — честный отказ, направление в принтерный сервис\n- объяснить клиенту что «принтер пишет «закончился картридж» хотя ещё есть» = чип-обнуление\n\n**что не делай:**\n- заправка картриджей (грязная работа, низкая цена, риск пролить тонер на свой ноут)\n- разборка лазерных принтеров (барабан хрупкий, легко сломать)\n- замена термопары / фьюзера (специфическая работа)\n\n**скрипт отказа:**\n> «по принтерам я только настройку драйверов и сети делаю. заправку/ремонт — направлю в специализированный сервис. контакты могу дать.»\n\nнайди 1-2 проверенных принтерных сервиса в своём районе и держи контакты — это твой реферальный поток.\n"}, {"title": "31. Android / iOS телефоны — позиция отказа", "cat": "G. Доступ / система", "html": "<p>Клиенты часто просят: «у меня телефон что-то делает не то, посмотри». Новички часто ошибаются, соглашаясь на это. Телефонный ремонт — отдельная профессия со своими инструментами (термостол, BGA, специфические запчасти, программаторы EFS/QCN).</p>\n<p><strong>Что МОЖНО делать без оборудования:</strong></p>\n<table><thead><tr><th>Запрос</th><th>Решение</th></tr></thead><tbody><tr><td>Перенос данных при покупке нового телефона</td><td>Android: Google аккаунт + Phone Clone. iOS: Apple ID + быстрый перенос через Bluetooth. 500₽/час</td></tr><tr><td>Резервное копирование контактов/фото</td><td>Google Photos / iCloud — настройка автосинхрона. 500-1000₽</td></tr><tr><td>Удаление вирусной рекламы (Android)</td><td>Безопасный режим → удалить недавние программы. Malwarebytes Mobile. 1000₽</td></tr><tr><td>Сброс настроек (после которого нужна повторная настройка)</td><td>Полная настройка чистого устройства. 1500₽</td></tr><tr><td>Настройка для пожилых (крупные иконки, простой запуск)</td><td>Лаунчер «Простой Дом для Пожилых» или «Big Launcher». 1000₽</td></tr></tbody></table>\n<p><strong>Что категорически НЕ делать:</strong></p>\n<ul>\n<li>Замена экрана/стекла (без термостола трещина пойдёт дальше)</li>\n<li>Замена аккумулятора (литий-полимер, см. курс безопасности — взрыв при проколе)</li>\n<li>Перепрошивка (риск кирпича без программатора)</li>\n<li>Восстановление данных с разбитого телефона (нужен Chip-Off оборудование)</li>\n<li>Любая пайка BGA-чипов</li>\n</ul>\n<p><strong>Скрипт отказа:</strong></p>\n<blockquote>«По телефонам я только программную часть делаю — перенос данных, настройка, удаление вирусов. Железо (экраны, батареи, пайка) — это отдельная специализация, не моя. Знаю проверенный сервис, могу дать контакт.»</blockquote>\n<p>Найди в своём районе <strong>проверенный</strong> телефонный сервис и держи контакт. Реферальный поток в обе стороны.</p>", "search": "31. android / ios телефоны — позиция отказа \nклиенты часто просят: «у меня телефон что-то делает не то, посмотри». новички часто ошибаются, соглашаясь на это. телефонный ремонт — отдельная профессия со своими инструментами (термостол, bga, специфические запчасти, программаторы efs/qcn).\n\n**что можно делать без оборудования:**\n\n| запрос | решение |\n|---|---|\n| перенос данных при покупке нового телефона | android: google аккаунт + phone clone. ios: apple id + быстрый перенос через bluetooth. 500₽/час |\n| резервное копирование контактов/фото | google photos / icloud — настройка автосинхрона. 500-1000₽ |\n| удаление вирусной рекламы (android) | безопасный режим → удалить недавние программы. malwarebytes mobile. 1000₽ |\n| сброс настроек (после которого нужна повторная настройка) | полная настройка чистого устройства. 1500₽ |\n| настройка для пожилых (крупные иконки, простой запуск) | лаунчер «простой дом для пожилых» или «big launcher». 1000₽ |\n\n**что категорически не делать:**\n- замена экрана/стекла (без термостола трещина пойдёт дальше)\n- замена аккумулятора (литий-полимер, см. курс безопасности — взрыв при проколе)\n- перепрошивка (риск кирпича без программатора)\n- восстановление данных с разбитого телефона (нужен chip-off оборудование)\n- любая пайка bga-чипов\n\n**скрипт отказа:**\n> «по телефонам я только программную часть делаю — перенос данных, настройка, удаление вирусов. железо (экраны, батареи, пайка) — это отдельная специализация, не моя. знаю проверенный сервис, могу дать контакт.»\n\nнайди в своём районе **проверенный** телефонный сервис и держи контакт. реферальный поток в обе стороны.\n"}, {"title": "32. Умный дом — настройка базовая", "cat": "G. Доступ / система", "html": "<p>В каждой второй квартире 2026 года есть какое-то из: Алиса/Маруся/Капсула, IP-камеры, умные лампочки, Wi-Fi термостаты, роботы-пылесосы. Клиент: «помоги настроить умный дом / добавить лампочку / разобраться с роутером».</p>\n<p><strong>Стандартные проблемы:</strong></p>\n<table><thead><tr><th>Проблема</th><th>Решение</th></tr></thead><tbody><tr><td>Лампочка не подключается</td><td>Проверь что Wi-Fi 2.4 ГГц (большинство IoT не работает на 5 ГГц), пароль без спецсимволов, лампочка близко к роутеру (не через 2 стены)</td></tr><tr><td>Алиса не слышит / отвечает с задержкой</td><td>Wi-Fi сигнал слабый. Меш-сеть (Keenetic, TP-Link Deco) или ретранслятор</td></tr><tr><td>Роутер режет интернет на половине квартиры</td><td>Mesh-Wi-Fi 2.4 + 5 ГГц одновременно, 2 точки на квартиру 70 м². 5-15 тыс комплект</td></tr><tr><td>Камера видеонаблюдения не записывает</td><td>Карта microSD высокого класса (U3/V30 для 4K). Облачная подписка</td></tr><tr><td>«Хочу видеть камеру через интернет»</td><td>Через приложение производителя (Tuya/Hik-Connect/Mi Home) или белый IP + перенаправление портов на роутере</td></tr></tbody></table>\n<p><strong>Что НЕ браться:</strong></p>\n<ul>\n<li>Профессиональная видеосеть с &gt;5 камерами (нужен NVR-сервер, отдельная специальность)</li>\n<li>Интеграция KNX / умного дома уровня бизнес-центра (специализированные интеграторы)</li>\n<li>Прошивка китайских камер «без английского интерфейса»</li>\n</ul>\n<p><strong>Цена услуг:</strong></p>\n<ul>\n<li>Настройка одного устройства умного дома — 800-1500₽</li>\n<li>Настройка меш-сети Wi-Fi — 2000-3500₽ (с настройкой бесшовного роуминга)</li>\n<li>Базовое обслуживание умного дома (несколько устройств) — 3000-5000₽</li>\n</ul>", "search": "32. умный дом — настройка базовая \nв каждой второй квартире 2026 года есть какое-то из: алиса/маруся/капсула, ip-камеры, умные лампочки, wi-fi термостаты, роботы-пылесосы. клиент: «помоги настроить умный дом / добавить лампочку / разобраться с роутером».\n\n**стандартные проблемы:**\n\n| проблема | решение |\n|---|---|\n| лампочка не подключается | проверь что wi-fi 2.4 ггц (большинство iot не работает на 5 ггц), пароль без спецсимволов, лампочка близко к роутеру (не через 2 стены) |\n| алиса не слышит / отвечает с задержкой | wi-fi сигнал слабый. меш-сеть (keenetic, tp-link deco) или ретранслятор |\n| роутер режет интернет на половине квартиры | mesh-wi-fi 2.4 + 5 ггц одновременно, 2 точки на квартиру 70 м². 5-15 тыс комплект |\n| камера видеонаблюдения не записывает | карта microsd высокого класса (u3/v30 для 4k). облачная подписка |\n| «хочу видеть камеру через интернет» | через приложение производителя (tuya/hik-connect/mi home) или белый ip + перенаправление портов на роутере |\n\n**что не браться:**\n- профессиональная видеосеть с >5 камерами (нужен nvr-сервер, отдельная специальность)\n- интеграция knx / умного дома уровня бизнес-центра (специализированные интеграторы)\n- прошивка китайских камер «без английского интерфейса»\n\n**цена услуг:**\n- настройка одного устройства умного дома — 800-1500₽\n- настройка меш-сети wi-fi — 2000-3500₽ (с настройкой бесшовного роуминга)\n- базовое обслуживание умного дома (несколько устройств) — 3000-5000₽\n"}, {"title": "33. NAS / домашний сервер — направить или базовая помощь", "cat": "G. Доступ / система", "html": "<p>NAS (сетевое хранилище) — отдельная специализация. Энтузиасты ставят Synology, QNAP, TrueNAS, Unraid.</p>\n<p><strong>Что МОЖНО:</strong></p>\n<ul>\n<li>Базовая настройка Synology/QNAP «из коробки» (создание массива, общая папка, базовое резервирование) — 3000-5000₽</li>\n<li>Подключение к роутеру и настройка доступа из локальной сети — 1500₽</li>\n<li>Базовая чистка / замена диска при отказе (если RAID-1) — 1500₽ + диск</li>\n</ul>\n<p><strong>Что НЕ браться без опыта:</strong></p>\n<ul>\n<li>Восстановление развалившегося RAID-5/RAID-6 (одна ошибка = всё)</li>\n<li>Миграция данных между NAS разных производителей</li>\n<li>Кастомные сборки на TrueNAS / Unraid (требуют админа Linux)</li>\n<li>Виртуальные машины и контейнеры (Docker, Proxmox) — это уже системное администрирование</li>\n</ul>\n<p><strong>Скрипт разговора:</strong></p>\n<blockquote>«По NAS я могу базовую настройку — собрать, подключить, открыть папку для домашних устройств. Сложные RAID-конфигурации и серверная виртуализация — это уже не моя специализация, для серьёзного NAS нужен сисадмин-линуксоид.»</blockquote>\n<p><strong>Цены:</strong> базовая настройка домашнего Synology DS220+ или QNAP TS-251D = 3000-5000₽. Это разовая услуга, потом клиент сам управляет через веб-интерфейс.</p>", "search": "33. nas / домашний сервер — направить или базовая помощь \nnas (сетевое хранилище) — отдельная специализация. энтузиасты ставят synology, qnap, truenas, unraid.\n\n**что можно:**\n- базовая настройка synology/qnap «из коробки» (создание массива, общая папка, базовое резервирование) — 3000-5000₽\n- подключение к роутеру и настройка доступа из локальной сети — 1500₽\n- базовая чистка / замена диска при отказе (если raid-1) — 1500₽ + диск\n\n**что не браться без опыта:**\n- восстановление развалившегося raid-5/raid-6 (одна ошибка = всё)\n- миграция данных между nas разных производителей\n- кастомные сборки на truenas / unraid (требуют админа linux)\n- виртуальные машины и контейнеры (docker, proxmox) — это уже системное администрирование\n\n**скрипт разговора:**\n> «по nas я могу базовую настройку — собрать, подключить, открыть папку для домашних устройств. сложные raid-конфигурации и серверная виртуализация — это уже не моя специализация, для серьёзного nas нужен сисадмин-линуксоид.»\n\n**цены:** базовая настройка домашнего synology ds220+ или qnap ts-251d = 3000-5000₽. это разовая услуга, потом клиент сам управляет через веб-интерфейс.\n"}, {"title": "34. Старое железо (DDR2/DDR3, PATA, AGP) — стоит ли ремонтировать", "cat": "G. Доступ / система", "html": "<p>Клиент приносит ПК 2008-2014 года. Типичная ситуация: «у меня старенький, не торопится, посмотри пожалуйста». Решение зависит от состояния и желания клиента.</p>\n<p><strong>Признаки «лучше не лечить»:</strong></p>\n<ul>\n<li>Материнка с DDR2 или раннего DDR3 (Intel Core 2 Duo, AMD Athlon X2) — современный браузер уже тормозит</li>\n<li>Жёсткий диск PATA (IDE-шлейф) — найти новый сложно, цены завышены</li>\n<li>Видеокарта AGP (старый разъём) — замена невозможна, разъём ушёл</li>\n<li>БП старше 8 лет — конденсаторы вздуты, опасность отказа</li>\n</ul>\n<p><strong>Что предложить клиенту:</strong></p>\n<table><thead><tr><th>Сценарий</th><th>Совет</th></tr></thead><tbody><tr><td>ПК для бабушки — только Word и YouTube</td><td>Чистка + SSD за 2500₽ + Windows 10 LTSC = ещё 3-5 лет жизни</td></tr><tr><td>ПК для игр/работы — клиент жалуется на тормоза</td><td>Не лечить. Новый минимальный игровой ПК — от 30 тыс. Объясни честно, не накручивай ремонт за 15 тыс на старье</td></tr><tr><td>Сентиментальная ценность («это мой первый ПК, не выкидывай»)</td><td>Только чистка + SSD. Не вкладывай больше — это потеря денег клиента</td></tr></tbody></table>\n<p><strong>Где брать старые комплектующие если ОЧЕНЬ нужно:</strong></p>\n<ul>\n<li><strong>Авито</strong> — большинство старого добра здесь. Цены завышены (часто х2-х3 от честной)</li>\n<li><strong>Юла</strong> — аналогично</li>\n<li><strong>Барахолки в локальных пабликах ВК</strong> — иногда халява</li>\n<li><strong>Радиорынки</strong> — в крупных городах ещё есть (Митино в Москве, Юнона в Питере)</li>\n</ul>\n<p><strong>Главный совет:</strong> не превращайся в мастера-некрофила. Старое железо — это редкий клиент. Основная масса будет требовать актуальных решений.</p>", "search": "34. старое железо (ddr2/ddr3, pata, agp) — стоит ли ремонтировать \nклиент приносит пк 2008-2014 года. типичная ситуация: «у меня старенький, не торопится, посмотри пожалуйста». решение зависит от состояния и желания клиента.\n\n**признаки «лучше не лечить»:**\n- материнка с ddr2 или раннего ddr3 (intel core 2 duo, amd athlon x2) — современный браузер уже тормозит\n- жёсткий диск pata (ide-шлейф) — найти новый сложно, цены завышены\n- видеокарта agp (старый разъём) — замена невозможна, разъём ушёл\n- бп старше 8 лет — конденсаторы вздуты, опасность отказа\n\n**что предложить клиенту:**\n\n| сценарий | совет |\n|---|---|\n| пк для бабушки — только word и youtube | чистка + ssd за 2500₽ + windows 10 ltsc = ещё 3-5 лет жизни |\n| пк для игр/работы — клиент жалуется на тормоза | не лечить. новый минимальный игровой пк — от 30 тыс. объясни честно, не накручивай ремонт за 15 тыс на старье |\n| сентиментальная ценность («это мой первый пк, не выкидывай») | только чистка + ssd. не вкладывай больше — это потеря денег клиента |\n\n**где брать старые комплектующие если очень нужно:**\n- **авито** — большинство старого добра здесь. цены завышены (часто х2-х3 от честной)\n- **юла** — аналогично\n- **барахолки в локальных пабликах вк** — иногда халява\n- **радиорынки** — в крупных городах ещё есть (митино в москве, юнона в питере)\n\n**главный совет:** не превращайся в мастера-некрофила. старое железо — это редкий клиент. основная масса будет требовать актуальных решений.\n"}, {"title": "35. Многомониторные конфигурации и калибровка экрана", "cat": "G. Доступ / система", "html": "<p>Стандартный запрос фотографа/дизайнера/трейдера: «помоги настроить 2-3 монитора + откалибровать под цветопередачу».</p>\n<p><strong>Многомониторная настройка:</strong></p>\n<ul>\n<li><strong>Проверка выходов видеокарты</strong> — современные имеют 1-3 DisplayPort + 1 HDMI. На бю
